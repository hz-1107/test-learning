<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>競賽經歷詳細頁 - 智慧學習歷程系統</title>
  <link rel="stylesheet" href="../css/styles.css">
  <link rel="stylesheet" href="../css/detail-page.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="detail-page" id="competitionDetail">
    <!-- 頂部黃色橫幅 -->
    <header class="detail-page__banner">
      <h1 class="detail-page__banner-title">競賽經歷－<span id="detailCompetitionName">競賽名稱</span></h1>
      <p class="detail-page__banner-subtitle" id="detailStudentMeta">學號姓名</p>
    </header>

    <!-- 內框：包住 Banner 圖、資料欄位、品牌 logo，與標題橫幅/操作按鈕做出區隔 -->
    <div class="detail-page__inner">
      <!-- 內容區：載入資料後顯示 -->
      <div id="detailContent">
        <!-- 中央 Banner 圖片：素材待補，先以佔位樣式呈現 -->
        <div class="detail-page__hero detail-page__hero--placeholder">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M6 9H4.5a2.5 2.5 0 010-5H6"/>
            <path d="M18 9h1.5a2.5 2.5 0 000-5H18"/>
            <path d="M4 22h16"/>
            <path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/>
            <path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/>
            <path d="M18 2H6v7a6 6 0 0012 0V2z"/>
          </svg>
          <span>Fun心競賽經歷 Banner（圖檔待提供）</span>
        </div>

        <!-- 資料區塊 -->
        <section class="detail-page__fields">
          <!-- 學生姓名 ＋ 競賽日期 -->
          <div class="detail-page__field-row">
            <div class="detail-page__field">
              <span class="detail-page__tag">學生姓名</span>
              <span class="detail-page__value detail-page__value--xl" id="detailStudentName">—</span>
            </div>
            <div class="detail-page__field">
              <span class="detail-page__tag">競賽日期</span>
              <span class="detail-page__value detail-page__value--lg detail-page__value--date" id="detailCompDate">—</span>
            </div>
          </div>

          <div class="detail-page__field">
            <span class="detail-page__tag">競賽名稱</span>
            <span class="detail-page__value detail-page__value--lg" id="detailCompTitle">—</span>
          </div>

          <div class="detail-page__field">
            <span class="detail-page__tag">主辦單位</span>
            <span class="detail-page__value" id="detailOrganizer">—</span>
          </div>

          <!-- 競賽等級 ＋ 競賽名次 -->
          <div class="detail-page__field-row">
            <div class="detail-page__field">
              <span class="detail-page__tag">競賽等級</span>
              <span class="detail-page__value detail-page__value--lg" id="detailLevel">—</span>
            </div>
            <div class="detail-page__field">
              <span class="detail-page__tag">競賽名次</span>
              <span class="detail-page__value detail-page__value--lg" id="detailRank">—</span>
            </div>
          </div>

          <div class="detail-page__field detail-page__field--block">
            <span class="detail-page__tag">競賽說明</span>
            <p class="detail-page__text" id="detailDescription">—</p>
          </div>

          <div class="detail-page__field detail-page__field--block">
            <span class="detail-page__tag">參賽證明</span>
            <div class="detail-page__photos detail-page__photos--center" id="detailPhotos"></div>
          </div>
        </section>
      </div>

      <!-- 查無資料狀態 -->
      <div class="detail-page__empty no-print" id="detailEmpty" style="display: none;">
        查無此筆競賽歷程資料，請返回列表重新選擇。
      </div>

      <!-- 品牌 logo + QR code -->
      <div class="detail-page__footer-brand">
        <img src="assets/images/logo-qr.png" alt="Fun學機器人 品牌標誌與 QR Code" class="detail-page__footer-brand-img">
      </div>
    </div>

    <!-- 內框外：操作按鈕 -->
    <footer class="detail-page__footer-actions no-print">
      <a href="student-competition.html" class="action-btn action-btn--outline">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="15 18 9 12 15 6"/>
        </svg>
        返回
      </a>
      <button type="button" class="action-btn action-btn--primary" id="printBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="6 9 6 2 18 2 18 9"/>
          <path d="M6 18H4a2 2 0 01-2-2v-5a2 2 0 012-2h16a2 2 0 012 2v5a2 2 0 01-2 2h-2"/>
          <rect x="6" y="14" width="12" height="8"/>
        </svg>
        列印或儲存成PDF
      </button>
    </footer>
  </div>

  <script src="../js/competition-data.js"></script>
  <script>
    // 依網址參數 id 從共用資料來源取得對應競賽紀錄
    const params = new URLSearchParams(window.location.search);
    const recordId = params.get('id');
    const record = competitionData.find(item => item.id === recordId);

    if (record) {
      document.title = `競賽經歷－${record.title} - 智慧學習歷程系統`;
      document.getElementById('detailCompetitionName').textContent = record.title;
      document.getElementById('detailStudentMeta').textContent = `${record.studentId}${record.studentName}`;
      document.getElementById('detailStudentName').textContent = record.studentName;
      document.getElementById('detailCompDate').textContent = record.date.replace(/-/g, '.');
      document.getElementById('detailCompTitle').textContent = record.title;
      document.getElementById('detailOrganizer').textContent = record.organizer;
      document.getElementById('detailLevel').textContent = record.levelLabel;
      document.getElementById('detailRank').textContent = record.rank;
      document.getElementById('detailDescription').textContent = record.description;

      const photosContainer = document.getElementById('detailPhotos');
      if (record.proofPhotos.length) {
        photosContainer.innerHTML = record.proofPhotos.map(photo => {
          // 正常情況：資料來源提供實際圖片路徑，直接顯示照片
          if (photo && photo.src) {
            return `
              <div class="detail-page__photo detail-page__photo--has-image">
                <img src="${photo.src}" alt="${photo.alt || record.title + ' 參賽證明'}">
              </div>
            `;
          }
          // 防呆：若該筆照片資料尚未提供路徑，顯示佔位圖示
          return `
            <div class="detail-page__photo">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
                <circle cx="8.5" cy="8.5" r="1.5"/>
                <polyline points="21 15 16 10 5 21"/>
              </svg>
            </div>
          `;
        }).join('');
      } else {
        photosContainer.innerHTML = '<span class="detail-page__photos--empty">尚未上傳參賽證明</span>';
      }
    } else {
      // 找不到對應紀錄時，隱藏資料區塊並顯示提示
      document.getElementById('detailContent').style.display = 'none';
      document.getElementById('detailEmpty').style.display = 'block';
      document.getElementById('detailCompetitionName').textContent = '—';
      document.getElementById('detailStudentMeta').textContent = '找不到對應的競賽歷程紀錄';
    }

    // 列印或儲存成 PDF
    document.getElementById('printBtn').addEventListener('click', function() {
      window.print();
    });
  </script>
</body>
</html>

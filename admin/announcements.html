<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>公告管理 - 智慧學習歷程系統</title>
  <link rel="stylesheet" href="../css/styles.css">
  <link rel="stylesheet" href="../css/admin-notifications.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    .admin-layout {
      display: grid;
      grid-template-columns: 220px 1fr;
      min-height: 100vh;
      background: var(--color-background);
    }

    /* 側邊欄 */
    .admin-sidebar {
      background: var(--color-surface-alt);
      padding: var(--spacing-lg) 0;
      display: flex;
      flex-direction: column;
    }

    .admin-sidebar__profile {
      display: flex;
      align-items: center;
      gap: var(--spacing-md);
      padding: 0 var(--spacing-lg) var(--spacing-xl);
      margin-bottom: var(--spacing-lg);
    }

    .admin-sidebar__avatar {
      width: 40px;
      height: 40px;
      background: var(--color-primary);
      border-radius: var(--radius-sm);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .admin-sidebar__avatar svg {
      width: 20px;
      height: 20px;
      color: var(--color-primary-dark);
    }

    .admin-sidebar__info {
      display: flex;
      flex-direction: column;
    }

    .admin-sidebar__name {
      font-size: var(--font-size-md);
      font-weight: 600;
      color: var(--color-primary-dark);
    }

    .admin-sidebar__subtitle {
      font-size: var(--font-size-xs);
      color: var(--color-text-muted);
    }

    .admin-sidebar__nav {
      display: flex;
      flex-direction: column;
      flex: 1;
    }

    .admin-sidebar__nav-item {
      display: flex;
      align-items: center;
      gap: var(--spacing-md);
      padding: 14px var(--spacing-lg);
      font-size: var(--font-size-md);
      color: var(--color-text-secondary);
      text-decoration: none;
      border-left: 3px solid transparent;
      transition: all 0.2s;
    }

    .admin-sidebar__nav-item:hover {
      background: rgba(117, 95, 0, 0.1);
      color: var(--color-text-primary);
    }

    .admin-sidebar__nav-item--active {
      background: var(--color-primary);
      border-left-color: var(--color-primary-dark);
      color: var(--color-primary-dark);
    }

    .admin-sidebar__nav-item svg {
      width: 18px;
      height: 18px;
    }

    /* 主內容區 */
    .admin-main {
      background: var(--color-background);
      display: flex;
      flex-direction: column;
    }

    /* 頂部導覽 */
    .admin-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: var(--spacing-md) var(--spacing-xl);
      background: var(--color-surface);
      border-bottom: 1px solid var(--color-surface-alt);
    }

    .admin-header__title {
      font-size: var(--font-size-lg);
      font-weight: 600;
      color: var(--color-primary-dark);
    }

    .admin-header__actions {
      display: flex;
      align-items: center;
      gap: var(--spacing-md);
    }

    .admin-header__search {
      display: flex;
      align-items: center;
      gap: var(--spacing-sm);
      padding: 8px 16px;
      background: var(--color-background);
      border: 1px solid var(--color-surface-alt);
      border-radius: var(--radius-md);
      width: 240px;
    }

    .admin-header__search input {
      border: none;
      background: transparent;
      font-size: var(--font-size-sm);
      color: var(--color-text-primary);
      width: 100%;
    }

    .admin-header__icon-btn {
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: var(--radius-md);
      color: var(--color-text-secondary);
      cursor: pointer;
      position: relative;
    }

    .admin-header__badge {
      position: absolute;
      top: 4px;
      right: 4px;
      width: 8px;
      height: 8px;
      background: #fe7560;
      border-radius: 50%;
    }

    .admin-header__avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: var(--color-primary);
      overflow: hidden;
    }

    .admin-header__avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* 頁面內容 */
    .admin-content {
      padding: var(--spacing-xl);
      flex: 1;
      overflow-y: auto;
    }

    .page-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: var(--spacing-lg);
      margin-bottom: var(--spacing-lg);
    }

    .page-title {
      font-size: 28px;
      font-weight: 700;
      color: var(--color-text-primary);
      margin-bottom: var(--spacing-xs);
    }

    .page-subtitle {
      font-size: var(--font-size-md);
      color: var(--color-text-muted);
    }

    .header-action-btn {
      display: flex;
      align-items: center;
      gap: var(--spacing-sm);
      padding: 12px 24px;
      background: var(--color-primary);
      border: none;
      border-radius: var(--radius-md);
      font-size: var(--font-size-md);
      font-weight: 500;
      color: var(--color-primary-dark);
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s;
    }

    .header-action-btn:hover {
      filter: brightness(0.96);
    }

    .header-action-btn svg {
      width: 16px;
      height: 16px;
    }

    .header-action-btn--outline {
      background: transparent;
      border: 1px solid var(--color-surface-alt);
      color: var(--color-text-secondary);
    }

    .header-action-btn--outline:hover {
      background: var(--color-surface-alt);
      filter: none;
    }

    /* 分頁切換（公告歷史 / 定時公告） */
    .page-tabs {
      display: flex;
      gap: var(--spacing-sm);
      border-bottom: 1px solid var(--color-surface-alt);
      margin-bottom: var(--spacing-xl);
    }

    .page-tab {
      padding: var(--spacing-sm) var(--spacing-lg);
      background: none;
      border: none;
      border-bottom: 2px solid transparent;
      margin-bottom: -1px;
      font-size: var(--font-size-md);
      font-weight: 500;
      color: var(--color-text-muted);
      cursor: pointer;
      transition: all 0.2s;
    }

    .page-tab:hover {
      color: var(--color-text-primary);
    }

    .page-tab--active {
      color: var(--color-primary-dark);
      border-bottom-color: var(--color-primary-dark);
    }

    .tab-panel__toolbar {
      display: flex;
      justify-content: flex-end;
      margin-bottom: var(--spacing-md);
    }

    /* 公告清單 */
    .announcement-list {
      display: flex;
      flex-direction: column;
      gap: var(--spacing-md);
    }

    .announcement-empty {
      background: var(--color-surface);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-sm);
      padding: var(--spacing-2xl);
      text-align: center;
      color: var(--color-text-muted);
      font-size: var(--font-size-md);
    }

    .announcement-card {
      background: var(--color-surface);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-sm);
      padding: var(--spacing-lg);
      border-left: 4px solid var(--color-surface-alt);
    }

    .announcement-card--urgent {
      border-left-color: #fe7560;
    }

    .announcement-card--pinned {
      border-left-color: var(--color-primary-dark);
    }

    .announcement-card__top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: var(--spacing-md);
      margin-bottom: var(--spacing-sm);
    }

    .announcement-card__heading {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: var(--spacing-sm);
    }

    .announcement-card__title {
      font-size: var(--font-size-lg);
      font-weight: 600;
      color: var(--color-text-primary);
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 3px 10px;
      border-radius: 999px;
      font-size: var(--font-size-xs);
      font-weight: 600;
      white-space: nowrap;
    }

    .badge--general {
      background: var(--color-surface-alt);
      color: var(--color-text-secondary);
    }

    .badge--urgent {
      background: #fe7560;
      color: white;
    }

    .badge--pinned {
      background: var(--color-primary);
      color: var(--color-primary-dark);
    }

    .announcement-card__content {
      font-size: var(--font-size-md);
      color: var(--color-text-secondary);
      margin-bottom: var(--spacing-md);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .announcement-card__meta {
      display: flex;
      flex-wrap: wrap;
      gap: var(--spacing-md);
      font-size: var(--font-size-sm);
      color: var(--color-text-muted);
      margin-bottom: var(--spacing-md);
    }

    .announcement-card__actions {
      display: flex;
      gap: var(--spacing-sm);
    }

    .card-action-btn {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      background: transparent;
      border: 1px solid var(--color-surface-alt);
      border-radius: var(--radius-md);
      font-size: var(--font-size-sm);
      color: var(--color-text-secondary);
      cursor: pointer;
      transition: all 0.2s;
    }

    .card-action-btn:hover {
      background: var(--color-surface-alt);
    }

    .card-action-btn svg {
      width: 14px;
      height: 14px;
    }

    .card-action-btn--pinned {
      border-color: var(--color-primary-dark);
      color: var(--color-primary-dark);
      background: var(--color-primary-light);
    }

    .card-action-btn--danger {
      color: #fe7560;
      border-color: #fe7560;
    }

    .card-action-btn--danger:hover {
      background: #fe7560;
      color: white;
    }

    /* 頁腳 */
    .admin-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: var(--spacing-lg) var(--spacing-xl);
      background: var(--color-surface);
      border-top: 1px solid var(--color-surface-alt);
      font-size: var(--font-size-sm);
      color: var(--color-text-muted);
    }

    .admin-footer__links {
      display: flex;
      gap: var(--spacing-lg);
    }

    .admin-footer__link {
      color: var(--color-text-muted);
      text-decoration: none;
    }

    /* Modal / 表單 */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      opacity: 0;
      visibility: hidden;
      transition: all 0.3s;
    }

    .modal-overlay.active {
      opacity: 1;
      visibility: visible;
    }

    .modal {
      background: var(--color-surface);
      border-radius: var(--radius-lg);
      width: 100%;
      max-width: 520px;
      max-height: 90vh;
      overflow-y: auto;
      transform: translateY(-20px);
      transition: transform 0.3s;
      margin: auto;
    }

    .modal-overlay.active .modal {
      transform: translateY(0);
    }

    .modal__header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: var(--spacing-lg);
      border-bottom: 1px solid var(--color-surface-alt);
    }

    .modal__title {
      font-size: var(--font-size-lg);
      font-weight: 600;
      color: var(--color-text-primary);
      margin: 0;
    }

    .modal__close {
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: none;
      background: transparent;
      font-size: 24px;
      color: var(--color-text-muted);
      cursor: pointer;
      border-radius: var(--radius-sm);
    }

    .modal__close:hover {
      background: var(--color-surface-alt);
    }

    .modal__body {
      padding: var(--spacing-lg);
    }

    .modal__footer {
      display: flex;
      justify-content: flex-end;
      gap: var(--spacing-md);
      padding: var(--spacing-lg);
      border-top: 1px solid var(--color-surface-alt);
    }

    .form-group {
      margin-bottom: var(--spacing-lg);
    }

    .form-group:last-child {
      margin-bottom: 0;
    }

    .form-label {
      display: block;
      font-size: var(--font-size-sm);
      font-weight: 500;
      color: var(--color-text-primary);
      margin-bottom: var(--spacing-sm);
    }

    .form-input,
    .form-select,
    .form-textarea {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid var(--color-surface-alt);
      border-radius: var(--radius-md);
      font-size: var(--font-size-md);
      color: var(--color-text-primary);
      background: var(--color-surface);
      transition: border-color 0.2s;
    }

    .form-input:focus,
    .form-select:focus,
    .form-textarea:focus {
      outline: none;
      border-color: var(--color-primary);
    }

    .form-textarea {
      resize: vertical;
      min-height: 80px;
    }

    /* 分段按鈕（公告類型 / 發送範圍） */
    .segmented-toggle {
      display: flex;
      gap: var(--spacing-sm);
    }

    .segmented-btn {
      flex: 1;
      padding: 10px;
      background: var(--color-surface);
      border: 1px solid var(--color-surface-alt);
      border-radius: var(--radius-md);
      font-size: var(--font-size-sm);
      color: var(--color-text-secondary);
      cursor: pointer;
      transition: all 0.2s;
    }

    .segmented-btn.active {
      border-color: var(--color-primary);
      background: var(--color-primary-light);
      color: var(--color-primary-dark);
      font-weight: 500;
    }

    .checkbox-group {
      display: flex;
      flex-wrap: wrap;
      gap: var(--spacing-md);
      margin-top: var(--spacing-sm);
      padding: var(--spacing-md);
      background: var(--color-background);
      border-radius: var(--radius-md);
    }

    .checkbox-group label {
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      font-size: var(--font-size-sm);
      color: var(--color-text-secondary);
    }

    .pin-checkbox-row {
      display: flex;
      align-items: center;
      gap: var(--spacing-sm);
      cursor: pointer;
      font-size: var(--font-size-md);
      color: var(--color-text-primary);
    }

    /* 響應式 */
    @media (max-width: 992px) {
      .admin-layout {
        grid-template-columns: 1fr;
      }

      .admin-sidebar {
        display: none;
      }
    }
  </style>
</head>
<body>
  <div class="admin-layout">
    <!-- 側邊欄 -->
    <aside class="admin-sidebar">
      <div class="admin-sidebar__profile">
        <div class="admin-sidebar__avatar">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="3" width="7" height="7"/>

            <rect x="3" y="14" width="7" height="7"/>

        </div>
        <div class="admin-sidebar__info">

          <span class="admin-sidebar__subtitle">管理者系統</span>
        </div>
      </div>

      <nav class="admin-sidebar__nav">

        </a>

        </a>
        <a href="teachers.html" class="admin-sidebar__nav-item">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">

            <circle cx="12" cy="7" r="4"/>

          教師管理
        </a>
        <a href="schedule.html" class="admin-sidebar__nav-item">

            <line x1="3" y1="10" x2="21" y2="10"/>
          </svg>
          課表排程
        </a>
        <a href="announcements.html" class="admin-sidebar__nav-item admin-sidebar__nav-item--active">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">

            <circle cx="12" cy="6" r="1"/>

      </nav>
    </aside>

    <!-- 主內容區 -->
    <main class="admin-main">
      <!-- 頂部導覽 -->
      <header class="admin-header">
        <h1 class="admin-header__title">智慧學習歷程系統</h1>
        <div class="admin-header__actions">
          <div class="admin-header__search">
            <input type="text" placeholder="搜尋系統功能...">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="11" cy="11" r="8"/>
              <path d="M21 21l-4.35-4.35"/>
            </svg>
          </div>
          <button class="admin-header__icon-btn" data-notification-btn>
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9"/>
              <path d="M13.73 21a2 2 0 01-3.46 0"/>
            </svg>
            <span class="admin-header__badge"></span>
          </button>
          <div class="admin-header__avatar">
            <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=admin" alt="頭像">
          </div>
        </div>
      </header>

      <!-- 頁面內容 -->
      <div class="admin-content">
        <div class="page-header">
          <div>
            <h2 class="page-title">公告管理</h2>
            <p class="page-subtitle">發布公告、管理公告歷史與定時公告</p>
          </div>
          <button class="header-action-btn" onclick="openAnnouncementModal('create')">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="12" y1="5" x2="12" y2="19"/>
              <line x1="5" y1="12" x2="19" y2="12"/>
            </svg>
            發布新公告
          </button>
        </div>

        <!-- 分頁切換 -->
        <div class="page-tabs">
          <button class="page-tab page-tab--active" id="tabHistoryBtn" onclick="switchAnnouncementTab('history')">公告歷史</button>
          <button class="page-tab" id="tabScheduledBtn" onclick="switchAnnouncementTab('scheduled')">定時公告</button>
        </div>

        <!-- 分頁1：公告歷史 -->
        <div id="tabPanelHistory">
          <div class="announcement-list" id="announcementHistoryList"></div>
        </div>

        <!-- 分頁2：定時公告 -->
        <div id="tabPanelScheduled" style="display: none;">
          <div class="tab-panel__toolbar">
            <button class="header-action-btn header-action-btn--outline" onclick="openAnnouncementModal('create-scheduled')">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <line x1="12" y1="5" x2="12" y2="19"/>
                <line x1="5" y1="12" x2="19" y2="12"/>
              </svg>
              新增定時公告
            </button>
          </div>
          <div class="announcement-list" id="scheduledAnnouncementList"></div>
        </div>
      </div>

      <!-- 頁腳 -->
      <footer class="admin-footer">
        <span>© 2023 智慧學習歷程系統 | 版權所有</span>
        <div class="admin-footer__links">
          <a href="#" class="admin-footer__link">服務條款</a>
          <a href="#" class="admin-footer__link">隱私政策</a>
          <a href="#" class="admin-footer__link">系統日誌</a>
        </div>
      </footer>
    </main>
  </div>

  <!-- 發布 / 編輯 / 定時公告 Modal（共用） -->
  <div class="modal-overlay" id="announcementModal">
    <div class="modal">
      <div class="modal__header">
        <h3 class="modal__title" id="announcementModalTitle">發布新公告</h3>
        <button class="modal__close" onclick="closeModal('announcementModal')">&times;</button>
      </div>
      <div class="modal__body">
        <div class="form-group">
          <label class="form-label">公告類型</label>
          <div class="segmented-toggle" id="typeToggle">
            <button type="button" class="segmented-btn active" data-type="一般" onclick="selectAnnouncementType('一般')">一般</button>
            <button type="button" class="segmented-btn" data-type="緊急" onclick="selectAnnouncementType('緊急')">緊急</button>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">公告標題</label>
          <input type="text" class="form-input" id="announcementTitle" placeholder="請輸入公告標題">
        </div>

        <div class="form-group">
          <label class="form-label">公告內容</label>
          <textarea class="form-textarea" id="announcementContent" rows="5" placeholder="請輸入公告內容..."></textarea>
        </div>

        <div class="form-group">
          <label class="form-label">發送對象</label>
          <div class="segmented-toggle" id="scopeToggle">
            <button type="button" class="segmented-btn active" data-scope="全校" onclick="selectAudienceScope('全校')">全校</button>
            <button type="button" class="segmented-btn" data-scope="特定班級" onclick="selectAudienceScope('特定班級')">特定班級</button>
            <button type="button" class="segmented-btn" data-scope="特定身分" onclick="selectAudienceScope('特定身分')">特定身分</button>
          </div>
          <div class="checkbox-group" id="scopeClassGroup" style="display: none;"></div>
          <div class="checkbox-group" id="scopeRoleGroup" style="display: none;"></div>
        </div>

        <div class="form-group" id="scheduleFieldGroup" style="display: none;">
          <label class="form-label">預定發布時間</label>
          <input type="datetime-local" class="form-input" id="announcementScheduledAt">
        </div>

        <div class="form-group">
          <label class="pin-checkbox-row">
            <input type="checkbox" id="announcementPinned">
            置頂此公告
          </label>
        </div>
      </div>
      <div class="modal__footer">
        <button class="header-action-btn header-action-btn--outline" onclick="closeModal('announcementModal')">取消</button>
        <button class="header-action-btn" id="announcementSaveBtn" onclick="saveAnnouncement()">發布</button>
      </div>
    </div>
  </div>

  <script src="../js/main.js"></script>
  <script src="../js/announcements-data.js"></script>
  <script src="../js/admin-notifications.js"></script>
  <script>
    // ===== 分頁切換（公告歷史 / 定時公告） =====
    function switchAnnouncementTab(tab) {
      const isHistory = tab === 'history';
      document.getElementById('tabPanelHistory').style.display = isHistory ? '' : 'none';
      document.getElementById('tabPanelScheduled').style.display = isHistory ? 'none' : '';
      document.getElementById('tabHistoryBtn').classList.toggle('page-tab--active', isHistory);
      document.getElementById('tabScheduledBtn').classList.toggle('page-tab--active', !isHistory);
    }

    // ===== 公告卡片渲染 =====
    function buildAnnouncementCard(item, isScheduled) {
      const typeBadge = item.type === '緊急'
        ? '<span class="badge badge--urgent">緊急</span>'
        : '<span class="badge badge--general">一般</span>';
      const pinnedBadge = item.isPinned ? '<span class="badge badge--pinned">📌 置頂</span>' : '';
      const cardClass = item.isPinned ? 'announcement-card--pinned' : (item.type === '緊急' ? 'announcement-card--urgent' : '');

      const timeLabel = isScheduled ? '預定發布' : '發布時間';
      const timeValue = isScheduled ? item.scheduledAt.replace('T', ' ') : item.publishedAt;

      const pinBtn = isScheduled ? '' : `
        <button class="card-action-btn ${item.isPinned ? 'card-action-btn--pinned' : ''}" onclick="toggleAnnouncementPin('${item.id}')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="12" y1="17" x2="12" y2="22"/>
            <path d="M5 17h14l-1.5-6.5A3 3 0 0014.6 8H9.4a3 3 0 00-2.9 2.5L5 17z"/>
          </svg>
          ${item.isPinned ? '取消置頂' : '置頂'}
        </button>`;

      const editHandler = isScheduled ? `openEditScheduledModal('${item.id}')` : `openEditAnnouncementModal('${item.id}')`;
      const deleteHandler = isScheduled ? `deleteScheduledAnnouncement('${item.id}')` : `deleteAnnouncement('${item.id}')`;
      const deleteLabel = isScheduled ? '取消排程' : '刪除';

      return `
        <div class="announcement-card ${cardClass}">
          <div class="announcement-card__top">
            <div class="announcement-card__heading">
              <span class="announcement-card__title">${item.title}</span>
              ${typeBadge}
              ${pinnedBadge}
            </div>
          </div>
          <div class="announcement-card__content">${item.content}</div>
          <div class="announcement-card__meta">
            <span>發送對象：${formatAudienceScope(item)}</span>
            <span>${timeLabel}：${timeValue}</span>
            <span>發布者：${item.author}</span>
          </div>
          <div class="announcement-card__actions">
            ${pinBtn}
            <button class="card-action-btn" onclick="${editHandler}">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"/>
              </svg>
              編輯
            </button>
            <button class="card-action-btn card-action-btn--danger" onclick="${deleteHandler}">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polyline points="3 6 5 6 21 6"/>
                <path d="M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6"/>
                <path d="M10 11v6"/>
                <path d="M14 11v6"/>
              </svg>
              ${deleteLabel}
            </button>
          </div>
        </div>
      `;
    }

    function renderAnnouncementHistory() {
      const container = document.getElementById('announcementHistoryList');
      const sorted = [...ANNOUNCEMENTS].sort((a, b) => {
        if (a.isPinned !== b.isPinned) return a.isPinned ? -1 : 1;
        return b.publishedAt.localeCompare(a.publishedAt);
      });

      if (sorted.length === 0) {
        container.innerHTML = '<div class="announcement-empty">目前尚無已發布的公告</div>';
        return;
      }
      container.innerHTML = sorted.map(item => buildAnnouncementCard(item, false)).join('');
    }

    function renderScheduledAnnouncements() {
      const container = document.getElementById('scheduledAnnouncementList');
      const sorted = [...SCHEDULED_ANNOUNCEMENTS].sort((a, b) => a.scheduledAt.localeCompare(b.scheduledAt));

      if (sorted.length === 0) {
        container.innerHTML = '<div class="announcement-empty">目前尚無定時公告</div>';
        return;
      }
      container.innerHTML = sorted.map(item => buildAnnouncementCard(item, true)).join('');
    }

    // ===== 置頂切換 / 刪除 =====
    function toggleAnnouncementPin(id) {
      const item = ANNOUNCEMENTS.find(a => a.id === id);
      if (!item) return;
      item.isPinned = !item.isPinned;
      renderAnnouncementHistory();
    }

    function deleteAnnouncement(id) {
      const item = ANNOUNCEMENTS.find(a => a.id === id);
      if (!item) return;
      if (!confirm(`確定要刪除公告「${item.title}」嗎？此動作無法復原。`)) return;
      const index = ANNOUNCEMENTS.findIndex(a => a.id === id);
      ANNOUNCEMENTS.splice(index, 1);
      renderAnnouncementHistory();
      if (typeof showMessage === 'function') showMessage('公告已刪除', 'success');
    }

    function deleteScheduledAnnouncement(id) {
      const item = SCHEDULED_ANNOUNCEMENTS.find(a => a.id === id);
      if (!item) return;
      if (!confirm(`確定要取消定時公告「${item.title}」嗎？`)) return;
      const index = SCHEDULED_ANNOUNCEMENTS.findIndex(a => a.id === id);
      SCHEDULED_ANNOUNCEMENTS.splice(index, 1);
      renderScheduledAnnouncements();
      if (typeof showMessage === 'function') showMessage('定時公告已取消', 'success');
    }

    // ===== 發布 / 編輯 Modal =====
    let announcementModalMode = 'create'; // create | edit | create-scheduled | edit-scheduled
    let editingAnnouncementId = null;

    function renderScopeCheckboxGroups(selectedScope, checkedClasses, checkedRoles) {
      const classGroup = document.getElementById('scopeClassGroup');
      const roleGroup = document.getElementById('scopeRoleGroup');

      classGroup.innerHTML = AUDIENCE_CLASSES.map(name => `
        <label>
          <input type="checkbox" class="scope-class-checkbox" value="${name}" ${checkedClasses.includes(name) ? 'checked' : ''}>
          ${name}
        </label>
      `).join('');

      roleGroup.innerHTML = AUDIENCE_ROLES.map(name => `
        <label>
          <input type="checkbox" class="scope-role-checkbox" value="${name}" ${checkedRoles.includes(name) ? 'checked' : ''}>
          ${name}
        </label>
      `).join('');

      classGroup.style.display = selectedScope === '特定班級' ? 'flex' : 'none';
      roleGroup.style.display = selectedScope === '特定身分' ? 'flex' : 'none';
    }

    function selectAnnouncementType(type) {
      document.querySelectorAll('#typeToggle .segmented-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.type === type);
      });
    }

    function selectAudienceScope(scope) {
      document.querySelectorAll('#scopeToggle .segmented-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.scope === scope);
      });
      const checkedClasses = Array.from(document.querySelectorAll('.scope-class-checkbox:checked')).map(el => el.value);
      const checkedRoles = Array.from(document.querySelectorAll('.scope-role-checkbox:checked')).map(el => el.value);
      renderScopeCheckboxGroups(scope, checkedClasses, checkedRoles);
    }

    function getSelectedType() {
      return document.querySelector('#typeToggle .segmented-btn.active').dataset.type;
    }

    function getSelectedScope() {
      return document.querySelector('#scopeToggle .segmented-btn.active').dataset.scope;
    }

    // mode: 'create' | 'create-scheduled'
    function openAnnouncementModal(mode) {
      announcementModalMode = mode;
      editingAnnouncementId = null;

      document.getElementById('announcementTitle').value = '';
      document.getElementById('announcementContent').value = '';
      document.getElementById('announcementPinned').checked = false;
      document.getElementById('announcementScheduledAt').value = '';

      selectAnnouncementType('一般');
      selectAudienceScope('全校');

      const isScheduled = mode === 'create-scheduled';
      document.getElementById('scheduleFieldGroup').style.display = isScheduled ? '' : 'none';
      document.getElementById('announcementModalTitle').textContent = isScheduled ? '新增定時公告' : '發布新公告';
      document.getElementById('announcementSaveBtn').textContent = isScheduled ? '排程發布' : '發布';

      document.getElementById('announcementModal').classList.add('active');
    }

    function openEditAnnouncementModal(id) {
      const item = ANNOUNCEMENTS.find(a => a.id === id);
      if (!item) return;
      announcementModalMode = 'edit';
      editingAnnouncementId = id;

      document.getElementById('announcementTitle').value = item.title;
      document.getElementById('announcementContent').value = item.content;
      document.getElementById('announcementPinned').checked = item.isPinned;
      document.getElementById('announcementScheduledAt').value = '';

      selectAnnouncementType(item.type);
      selectAudienceScope(item.scope);
      renderScopeCheckboxGroups(
        item.scope,
        item.scope === '特定班級' ? item.scopeDetail : [],
        item.scope === '特定身分' ? item.scopeDetail : []
      );

      document.getElementById('scheduleFieldGroup').style.display = 'none';
      document.getElementById('announcementModalTitle').textContent = '編輯公告';
      document.getElementById('announcementSaveBtn').textContent = '儲存變更';

      document.getElementById('announcementModal').classList.add('active');
    }

    function openEditScheduledModal(id) {
      const item = SCHEDULED_ANNOUNCEMENTS.find(a => a.id === id);
      if (!item) return;
      announcementModalMode = 'edit-scheduled';
      editingAnnouncementId = id;

      document.getElementById('announcementTitle').value = item.title;
      document.getElementById('announcementContent').value = item.content;
      document.getElementById('announcementPinned').checked = item.isPinned;
      document.getElementById('announcementScheduledAt').value = item.scheduledAt;

      selectAnnouncementType(item.type);
      selectAudienceScope(item.scope);
      renderScopeCheckboxGroups(
        item.scope,
        item.scope === '特定班級' ? item.scopeDetail : [],
        item.scope === '特定身分' ? item.scopeDetail : []
      );

      document.getElementById('scheduleFieldGroup').style.display = '';
      document.getElementById('announcementModalTitle').textContent = '編輯定時公告';
      document.getElementById('announcementSaveBtn').textContent = '儲存變更';

      document.getElementById('announcementModal').classList.add('active');
    }

    function closeModal(modalId) {
      document.getElementById(modalId).classList.remove('active');
    }

    function saveAnnouncement() {
      const title = document.getElementById('announcementTitle').value.trim();
      const content = document.getElementById('announcementContent').value.trim();
      if (!title || !content) {
        if (typeof showMessage === 'function') showMessage('請輸入公告標題與內容', 'error');
        return;
      }

      const scope = getSelectedScope();
      const scopeDetail = scope === '特定班級'
        ? Array.from(document.querySelectorAll('.scope-class-checkbox:checked')).map(el => el.value)
        : scope === '特定身分'
          ? Array.from(document.querySelectorAll('.scope-role-checkbox:checked')).map(el => el.value)
          : [];

      if ((scope === '特定班級' || scope === '特定身分') && scopeDetail.length === 0) {
        if (typeof showMessage === 'function') showMessage('請至少選擇一個發送對象', 'error');
        return;
      }

      const isPinned = document.getElementById('announcementPinned').checked;
      const type = getSelectedType();

      if (announcementModalMode === 'create') {
        ANNOUNCEMENTS.unshift({
          id: generateAnnouncementId('a'),
          title, content, type, scope, scopeDetail, isPinned,
          publishedAt: new Date().toISOString().slice(0, 16).replace('T', ' '),
          author: '嚴大明 老師'
        });
        renderAnnouncementHistory();
        switchAnnouncementTab('history');
        if (typeof showMessage === 'function') showMessage('公告已發布成功！', 'success');

      } else if (announcementModalMode === 'edit') {
        const item = ANNOUNCEMENTS.find(a => a.id === editingAnnouncementId);
        Object.assign(item, { title, content, type, scope, scopeDetail, isPinned });
        renderAnnouncementHistory();
        if (typeof showMessage === 'function') showMessage('公告已更新！', 'success');

      } else if (announcementModalMode === 'create-scheduled') {
        const scheduledAt = document.getElementById('announcementScheduledAt').value;
        if (!scheduledAt) {
          if (typeof showMessage === 'function') showMessage('請選擇預定發布時間', 'error');
          return;
        }
        SCHEDULED_ANNOUNCEMENTS.push({
          id: generateAnnouncementId('s'),
          title, content, type, scope, scopeDetail, isPinned, scheduledAt,
          author: '嚴大明 老師'
        });
        renderScheduledAnnouncements();
        if (typeof showMessage === 'function') showMessage('已建立定時公告！', 'success');

      } else if (announcementModalMode === 'edit-scheduled') {
        const scheduledAt = document.getElementById('announcementScheduledAt').value;
        if (!scheduledAt) {
          if (typeof showMessage === 'function') showMessage('請選擇預定發布時間', 'error');
          return;
        }
        const item = SCHEDULED_ANNOUNCEMENTS.find(a => a.id === editingAnnouncementId);
        Object.assign(item, { title, content, type, scope, scopeDetail, isPinned, scheduledAt });
        renderScheduledAnnouncements();
        if (typeof showMessage === 'function') showMessage('定時公告已更新！', 'success');
      }

      closeModal('announcementModal');
    }

    // 點擊模態框外部關閉
    document.querySelectorAll('.modal-overlay').forEach(overlay => {
      overlay.addEventListener('click', function(e) {
        if (e.target === this) {
          this.classList.remove('active');
        }
      });
    });

    // 初始渲染
    renderAnnouncementHistory();
    renderScheduledAnnouncements();
  </script>
</body>
</html>

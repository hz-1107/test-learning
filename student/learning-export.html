<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>學習歷程詳細頁 - 智慧學習歷程系統</title>
  <link rel="stylesheet" href="../css/styles.css">
  <link rel="stylesheet" href="../css/detail-page.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    /* 後端回傳的課程說明含換行，保留斷行呈現 */
    .detail-page__text { white-space: pre-wrap; }
    /* 匯出 PDF 時暫時隱藏按鈕列 */
    .is-exporting .no-print { display: none !important; }
  </style>
</head>
<body>
  <div class="detail-page" id="portfolioDetail">
    <!-- 頂部黃色橫幅 -->
    <header class="detail-page__banner">
      <h1 class="detail-page__banner-title">學習歷程－<span id="detailCourseName">載入中…</span></h1>
      <p class="detail-page__banner-subtitle" id="detailStudentMeta">學號　姓名</p>
    </header>

    <!-- 內框：包住 Banner 圖、資料欄位、品牌 logo，與標題橫幅/操作按鈕做出區隔 -->
    <div class="detail-page__inner">
      <!-- 內容區：載入資料後顯示 -->
      <div id="detailContent">
        <!-- 中央 Banner 圖片 -->
        <div class="detail-page__hero">
          <img src="assets/images/banner-fun-learning.png" alt="Fun心學習歷程">
        </div>

        <!-- 資料區塊 -->
        <section class="detail-page__fields">
          <div class="detail-page__field">
            <span class="detail-page__tag">學生姓名</span>
            <span class="detail-page__value detail-page__value--xl" id="detailStudentName">—</span>
          </div>
          <div class="detail-page__field">
            <span class="detail-page__tag">學習時間</span>
            <span class="detail-page__value detail-page__value--lg detail-page__value--date" id="detailDate">—</span>
          </div>
          <div class="detail-page__field">
            <span class="detail-page__tag">課程名稱</span>
            <span class="detail-page__value detail-page__value--lg" id="detailCourseNameField">—</span>
          </div>
          <div class="detail-page__field detail-page__field--block">
            <span class="detail-page__tag">課程說明</span>
            <p class="detail-page__text" id="detailDescription">—</p>
          </div>
          <div class="detail-page__field detail-page__field--block">
            <span class="detail-page__tag">學習照片</span>
            <div class="detail-page__photos" id="detailPhotos"></div>
          </div>
        </section>
      </div>

      <!-- 查無資料 / 載入失敗狀態 -->
      <div class="detail-page__empty no-print" id="detailEmpty" style="display: none;">
        查無此筆學習歷程資料，請返回列表重新選擇。
      </div>

      <!-- 品牌 logo + QR code -->
      <div class="detail-page__footer-brand">
        <img src="assets/images/logo-qr.png" alt="Fun學機器人 品牌標誌與 QR Code" class="detail-page__footer-brand-img">
      </div>
    </div>

    <!-- 內框外：操作按鈕 -->
    <footer class="detail-page__footer-actions no-print">
      <a href="student-portfolio.html" class="action-btn action-btn--outline" id="backBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="15 18 9 12 15 6"/>
        </svg>
        返回
      </a>
      <button type="button" class="action-btn action-btn--primary" id="printBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="6 9 6 2 18 2 18 9"/>
          <path d="M6 18H4a2 2 0 01-2-2v-5a2 2 0 012-2h16a2 2 0 012 2v5a2 2 0 01-2 2h-2"/>
          <rect x="6" y="14" width="12" height="8"/>
        </svg>
        列印或儲存成PDF
      </button>
    </footer>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
  <script src="../js/api.js"></script>
  <script>
    const API_BASE = 'http://localhost:3000';

    // 目前頁面上顯示的資料，供產生 PDF 檔名使用
    const currentRecord = { studentName: '學生', courseName: '課程' };

    // 從網址取得參數：支援 log_id（日誌）與 id（學習紀錄）兩種來源
    function getUrlParams() {
      const params = new URLSearchParams(window.location.search);
      return {
        recordId: params.get('id'),
        logId: params.get('log_id'),
        studentId: params.get('student_id')
      };
    }

    function authHeaders(token) {
      return { headers: { 'Authorization': `Bearer ${token}` } };
    }

    // 日期格式化為 YYYY.MM.DD
    function formatDate(dateStr) {
      if (!dateStr) return '—';
      const date = new Date(dateStr);
      if (isNaN(date.getTime())) return String(dateStr).replace(/-/g, '.');
      const year = date.getFullYear();
      const month = String(date.getMonth() + 1).padStart(2, '0');
      const day = String(date.getDate()).padStart(2, '0');
      return `${year}.${month}.${day}`;
    }

    // 後端可能回傳相對路徑，補上 API 網域
    function resolvePhotoUrl(photo) {
      const raw = typeof photo === 'string' ? photo : (photo.photo_url || photo.url || photo.path || '');
      if (!raw) return '';
      if (/^https?:\/\//i.test(raw)) return raw;
      return `${API_BASE}${raw.startsWith('/') ? '' : '/'}${raw}`;
    }

    function escapeHtml(str) {
      return String(str).replace(/[&<>"']/g, c => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[c]));
    }

    // 顯示查無資料狀態
    function showEmpty(message) {
      document.getElementById('detailContent').style.display = 'none';
      const empty = document.getElementById('detailEmpty');
      empty.textContent = message || '查無此筆學習歷程資料，請返回列表重新選擇。';
      empty.style.display = 'block';
      document.getElementById('detailCourseName').textContent = '—';
      document.getElementById('detailStudentMeta').textContent = '找不到對應的學習歷程紀錄';
    }

    // 將一筆紀錄寫入畫面（沿用原本的版型節點）
    function renderRecord({ courseName, date, description, photos }) {
      currentRecord.courseName = courseName;

      document.title = `學習歷程－${courseName} - 智慧學習歷程系統`;
      document.getElementById('detailCourseName').textContent = courseName;
      document.getElementById('detailDate').textContent = formatDate(date);
      document.getElementById('detailCourseNameField').textContent = courseName;
      document.getElementById('detailDescription').textContent = description || '無課程說明';

      renderPhotos(photos || [], courseName);
    }

    function renderPhotos(photos, courseName) {
      const photosContainer = document.getElementById('detailPhotos');
      const list = (photos || []).map(resolvePhotoUrl).filter(Boolean);

      if (!list.length) {
        photosContainer.innerHTML = '<span class="detail-page__photos--empty">尚未上傳學習照片</span>';
        return;
      }

      photosContainer.innerHTML = list.map(src => `
        <div class="detail-page__photo detail-page__photo--has-image">
          <img src="${escapeHtml(src)}" alt="${escapeHtml(courseName)} 學習照片" crossorigin="anonymous">
        </div>
      `).join('');
    }

    // 取得學生基本資料，填入橫幅與姓名欄位
    async function loadStudentProfile(token) {
      try {
        const res = await fetch(`${API_BASE}/api/students/me`, authHeaders(token));
        if (!res.ok) return;
        const profile = await res.json();
        const student = profile.data?.student || {};
        const studentName = student.name || '學生';
        const studentNo = student.student_no || '';

        currentRecord.studentName = studentName;
        document.getElementById('detailStudentName').textContent = studentName;
        document.getElementById('detailStudentMeta').textContent =
          studentNo ? `${studentNo}　${studentName}` : studentName;
      } catch (e) {
        console.error('載入學生資料失敗:', e);
      }
    }

    // 以 log_id 取得日誌與照片
    async function loadByLogId(token, logId) {
      const logRes = await fetch(`${API_BASE}/api/logs/${logId}`, authHeaders(token));
      if (!logRes.ok) return false;

      const log = (await logRes.json()).data || {};
      const courseName = log.course_type || log.course_name || log.title || '課程';

      let description = '';
      if (log.topic) description += log.topic + '\n\n';
      if (log.content) description += log.content;

      let photos = [];
      try {
        const photosRes = await fetch(`${API_BASE}/api/logs/${logId}/photos`, authHeaders(token));
        if (photosRes.ok) photos = (await photosRes.json()).data || [];
      } catch (e) {
        console.log('無法取得照片:', e);
      }

      renderRecord({ courseName, date: log.log_date, description: description.trim(), photos });
      return true;
    }

    // 以 id 從學習紀錄列表中找出該筆
    async function loadByRecordId(token, recordId) {
      const res = await fetch(`${API_BASE}/api/students/me/records?limit=100`, authHeaders(token));
      if (!res.ok) return false;

      const records = (await res.json()).data?.records || [];
      const record = records.find(r => String(r.id) === String(recordId));
      if (!record) return false;

      const courseName = record.course_type_name || record.course_name || '課程';

      let description = '';
      if (record.topic) description += record.topic + '\n\n';
      if (record.content) description += record.content + '\n\n';
      if (record.performance) description += '課堂表現：' + record.performance;

      renderRecord({
        courseName,
        date: record.log_date,
        description: description.trim(),
        photos: record.photos || []
      });
      return true;
    }

    // 主流程
    async function loadLearningRecord() {
      const token = localStorage.getItem('authToken');
      if (!token) {
        window.location.href = '../login.html';
        return;
      }

      const params = getUrlParams();
      await loadStudentProfile(token);

      if (!params.logId && !params.recordId) {
        showEmpty('請從學習歷程列表選擇要檢視的紀錄。');
        return;
      }

      try {
        const ok = params.logId
          ? await loadByLogId(token, params.logId)
          : await loadByRecordId(token, params.recordId);

        if (!ok) showEmpty();
      } catch (error) {
        console.error('載入學習紀錄失敗:', error);
        showEmpty('載入失敗，請檢查網路連線後重新整理頁面。');
      }
    }

    // 返回：優先回上一頁，否則回列表
    document.getElementById('backBtn').addEventListener('click', function(e) {
      if (window.history.length > 1) {
        e.preventDefault();
        window.history.back();
      }
    });

    // 列印或儲存成 PDF（html2canvas + jsPDF，失敗時退回瀏覽器列印）
    async function printOrSave() {
      const page = document.getElementById('portfolioDetail');

      if (typeof html2canvas === 'undefined' || typeof window.jspdf === 'undefined') {
        window.print();
        return;
      }

      document.body.classList.add('is-exporting');

      try {
        if (document.fonts && document.fonts.ready) await document.fonts.ready;

        const images = page.querySelectorAll('img');
        await Promise.all(Array.from(images).map(img => {
          if (img.complete) return Promise.resolve();
          return new Promise(resolve => {
            img.onload = resolve;
            img.onerror = resolve;
          });
        }));

        const canvas = await html2canvas(page, {
          scale: 2,
          backgroundColor: '#ffffff',
          useCORS: true,
          allowTaint: true,
          logging: false
        });

        const imgData = canvas.toDataURL('image/jpeg', 0.92);
        const { jsPDF } = window.jspdf;
        const pdf = new jsPDF({ orientation: 'p', unit: 'mm', format: 'a4', compress: true });

        const pageWidth = pdf.internal.pageSize.getWidth();
        const pageHeight = pdf.internal.pageSize.getHeight();
        const imgWidth = pageWidth;
        const imgHeight = (canvas.height * imgWidth) / canvas.width;

        let heightLeft = imgHeight;
        let position = 0;

        pdf.addImage(imgData, 'JPEG', 0, position, imgWidth, imgHeight, undefined, 'FAST');
        heightLeft -= pageHeight;

        while (heightLeft > 0) {
          position = heightLeft - imgHeight;
          pdf.addPage();
          pdf.addImage(imgData, 'JPEG', 0, position, imgWidth, imgHeight, undefined, 'FAST');
          heightLeft -= pageHeight;
        }

        const dateStr = new Date().toISOString().split('T')[0].replace(/-/g, '');
        pdf.save(`學習歷程_${currentRecord.studentName}_${currentRecord.courseName}_${dateStr}.pdf`);
      } catch (error) {
        console.error('PDF 匯出失敗:', error);
        window.print();
      } finally {
        document.body.classList.remove('is-exporting');
      }
    }

    document.getElementById('printBtn').addEventListener('click', printOrSave);
    document.addEventListener('DOMContentLoaded', loadLearningRecord);
  </script>
</body>
</html>

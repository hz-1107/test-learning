<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <script src="../js/config.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>課表排程 - 智慧學習歷程系統</title>
  <link rel="stylesheet" href="../css/styles.css">
  <link rel="stylesheet" href="../css/staff-font-size.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    .staff-layout { display: grid; grid-template-columns: 224px 1fr; min-height: 100vh; background: var(--color-background); }
    .staff-sidebar { background: var(--color-surface-alt); padding: var(--spacing-lg) var(--spacing-md); display: flex; flex-direction: column; }
    .staff-sidebar__header { font-size: var(--font-size-sm); color: var(--color-text-muted); margin-bottom: var(--spacing-lg); }
    .staff-sidebar__profile { display: flex; align-items: center; gap: var(--spacing-md); padding: var(--spacing-md); margin-bottom: var(--spacing-lg); }
    .staff-sidebar__avatar { width: 36px; height: 36px; background: var(--color-primary); border-radius: var(--radius-sm); display: flex; align-items: center; justify-content: center; font-size: var(--font-size-md); font-weight: 600; color: var(--color-primary-dark); }
    .staff-sidebar__info { display: flex; flex-direction: column; }
    .staff-sidebar__name { font-size: var(--font-size-md); font-weight: 600; color: var(--color-text-primary); }
    .staff-sidebar__role { font-size: var(--font-size-xs); color: var(--color-text-muted); }
    .staff-sidebar__nav { display: flex; flex-direction: column; gap: 4px; flex: 1; }
    .staff-sidebar__nav-item { display: flex; align-items: center; gap: var(--spacing-md); padding: 10px 12px; font-size: var(--font-size-md); color: var(--color-text-secondary); text-decoration: none; border-radius: var(--radius-md); transition: all 0.2s; }
    .staff-sidebar__nav-item:hover { background: rgba(117, 95, 0, 0.08); color: var(--color-text-primary); }
    .staff-sidebar__nav-item--active { background: var(--color-primary); color: var(--color-primary-dark); }
    .staff-sidebar__nav-item svg { width: 18px; height: 18px; }
    .staff-sidebar__footer { padding-top: var(--spacing-lg); border-top: 1px solid var(--color-surface); font-size: var(--font-size-xs); color: var(--color-text-muted); display: flex; align-items: center; gap: var(--spacing-sm); }
    .staff-main { display: flex; flex-direction: column; overflow: hidden; }
    .staff-header { display: flex; align-items: center; justify-content: space-between; padding: var(--spacing-md) var(--spacing-xl); background: var(--color-surface); border-bottom: 1px solid var(--color-surface-alt); }
    .staff-header__title { font-size: 24px; font-weight: 700; color: var(--color-primary-dark); }
    .staff-header__actions { display: flex; align-items: center; gap: var(--spacing-md); }
    .staff-header__icon-btn { width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; border-radius: var(--radius-md); color: var(--color-text-secondary); cursor: pointer; }
    .staff-header__avatar { width: 36px; height: 36px; border-radius: 50%; background: var(--color-primary); overflow: hidden; }
    .staff-header__avatar img { width: 100%; height: 100%; object-fit: cover; }
    .staff-content { padding: var(--spacing-xl); flex: 1; overflow-y: auto; }
    .page-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: var(--spacing-lg); }
    .page-title { font-size: 26px; font-weight: 700; color: var(--color-text-primary); }
    .btn-primary { display: flex; align-items: center; gap: var(--spacing-sm); padding: 10px 20px; background: var(--color-primary); border: none; border-radius: var(--radius-md); font-size: var(--font-size-md); font-weight: 500; color: var(--color-primary-dark); cursor: pointer; }

    /* 調課 Modal */
    .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0, 0, 0, 0.5); display: flex; align-items: flex-start; justify-content: center; z-index: 1000; opacity: 0; visibility: hidden; transition: all 0.3s; padding: 20px; overflow-y: auto; }
    .modal-overlay.active { opacity: 1; visibility: visible; }
    .modal { display: block; position: static; inset: auto; padding: 0; background: var(--color-surface); border-radius: var(--radius-lg); width: 100%; max-width: 480px; max-height: 90vh; overflow-y: auto; }
    .modal__header { position: static; display: flex; align-items: center; justify-content: space-between; padding: var(--spacing-lg); background: var(--color-surface); border-bottom: 1px solid var(--color-surface-alt); }
    .modal__title { font-size: var(--font-size-lg); font-weight: 600; color: var(--color-text-primary); }
    .modal__close { width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; border-radius: var(--radius-sm); cursor: pointer; color: var(--color-text-muted); }
    .modal__close:hover { background: var(--color-surface-alt); }
    .modal__body { padding: var(--spacing-lg); }
    .modal__footer { display: flex; justify-content: flex-end; gap: var(--spacing-md); padding: var(--spacing-lg); border-top: 1px solid var(--color-surface-alt); }
    .modal__hint { display: flex; gap: 8px; background: var(--color-warning-bg); color: var(--color-warning); font-size: var(--font-size-sm); line-height: 1.6; padding: 10px 12px; border-radius: var(--radius-md); margin-bottom: var(--spacing-lg); }
    .modal__hint svg { flex-shrink: 0; margin-top: 2px; }
    .form-group { margin-bottom: var(--spacing-lg); }
    .form-group:last-child { margin-bottom: 0; }
    .form-group > label { display: block; font-size: var(--font-size-sm); font-weight: 500; color: var(--color-text-primary); margin-bottom: var(--spacing-sm); }
    .form-group__req { color: var(--color-error); margin-left: 2px; }
    .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 10px 12px; background: var(--color-background); border: 1px solid var(--color-surface-alt); border-radius: var(--radius-md); font-size: var(--font-size-md); color: var(--color-text-primary); font-family: inherit; }
    .form-group input:focus, .form-group select:focus, .form-group textarea:focus { outline: none; border-color: var(--color-primary); background: var(--color-surface); }
    .form-group textarea { resize: vertical; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: var(--spacing-md); }
    .form-row--single { grid-template-columns: 1fr; }
    .adjustment-type-btns { display: flex; gap: var(--spacing-sm); }
    .adjustment-type-btn { flex: 1; padding: 10px 8px; text-align: center; background: var(--color-surface); border: 1px solid var(--color-surface-alt); border-radius: var(--radius-md); cursor: pointer; font-size: var(--font-size-sm); color: var(--color-text-secondary); transition: all 0.15s; }
    .adjustment-type-btn:hover { border-color: var(--color-primary); }
    .adjustment-type-btn.active { background: var(--color-primary); border-color: var(--color-primary); color: var(--color-primary-dark); font-weight: 600; }
    .schedule-info { background: var(--color-background); border-radius: var(--radius-md); padding: var(--spacing-md); margin-bottom: var(--spacing-lg); }
    .schedule-info__title { font-weight: 600; color: var(--color-text-primary); margin-bottom: var(--spacing-xs); }
    .schedule-info__detail { font-size: var(--font-size-sm); color: var(--color-text-secondary); }
    .form-error { color: var(--color-error); font-size: var(--font-size-sm); margin-top: var(--spacing-sm); min-height: 0; }
    .modal__footer .btn-primary { justify-content: center; }
    .modal__footer .btn-primary:disabled { opacity: 0.55; cursor: not-allowed; }

    /* ===== 課程列表分頁 ===== */
    .schedule-list[hidden] { display: none; }
    .schedule-list table { width: 100%; border-collapse: collapse; background: var(--color-surface); border-radius: var(--radius-lg); overflow: hidden; box-shadow: var(--shadow-sm); }
    .schedule-list th, .schedule-list td { padding: 14px 16px; text-align: left; border-bottom: 1px solid var(--color-surface-alt); }
    .schedule-list th { background: var(--color-background); font-size: var(--font-size-sm); font-weight: 600; color: var(--color-text-secondary); }
    .schedule-list td { font-size: var(--font-size-md); color: var(--color-text-primary); }
    .schedule-list tbody tr:hover { background: var(--color-background); }
    .schedule-list tbody tr:last-child td { border-bottom: none; }
    .schedule-list .col-actions { text-align: right; }
    .col-sort { display: inline-flex; align-items: center; gap: 4px; padding: 0; background: none; border: none; font: inherit; font-weight: 600; color: var(--color-text-secondary); cursor: pointer; }
    .col-sort:hover { color: var(--color-text-primary); }
    .col-sort__ico { font-size: 11px; line-height: 1; opacity: 0.4; }
    .col-sort--active .col-sort__ico { opacity: 1; color: var(--color-primary-dark); }
    .class-actions { display: inline-flex; gap: var(--spacing-sm); }
    .class-actions button { width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; border: none; border-radius: var(--radius-sm); background: transparent; color: var(--color-text-muted); cursor: pointer; }
    .class-actions button:hover { background: var(--color-surface-alt); color: var(--color-text-primary); }
    .schedule-list__empty { padding: 40px 20px; text-align: center; color: var(--color-text-muted); }
    .pagination { display: flex; align-items: center; justify-content: center; gap: var(--spacing-sm); padding: var(--spacing-lg); }
    .pagination__btn { min-width: 32px; height: 32px; padding: 0 6px; display: flex; align-items: center; justify-content: center; border: 1px solid var(--color-surface-alt); background: var(--color-surface); border-radius: var(--radius-sm); font-size: var(--font-size-sm); color: var(--color-text-secondary); cursor: pointer; }
    .pagination__btn:hover:not(:disabled) { background: var(--color-surface-alt); }
    .pagination__btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .pagination__btn--active { background: var(--color-primary); border-color: var(--color-primary); color: var(--color-primary-dark); font-weight: 600; }

    /* 學生名單 Modal */
    .student-list-modal .modal__body { padding: 0; }
    .student-modal__info { display: flex; gap: var(--spacing-md); padding: var(--spacing-md) var(--spacing-lg); border-bottom: 1px solid var(--color-surface-alt); font-size: var(--font-size-sm); color: var(--color-text-muted); }
    .student-modal__list { padding: var(--spacing-lg); max-height: 400px; overflow-y: auto; }
    .student-item { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; background: var(--color-background); border-radius: var(--radius-md); margin-bottom: var(--spacing-sm); }
    .student-item:last-child { margin-bottom: 0; }
    .student-item__left { display: flex; align-items: center; gap: 12px; }
    .student-item__avatar { width: 28px; height: 28px; border-radius: 50%; background: rgba(255, 219, 88, 0.4); display: flex; align-items: center; justify-content: center; font-size: var(--font-size-sm); font-weight: 500; color: var(--color-text-primary); }
    .student-item__name { font-size: var(--font-size-md); font-weight: 500; color: var(--color-text-primary); }
    .student-item__right { display: flex; align-items: center; gap: var(--spacing-sm); }
    .student-item__school { font-size: var(--font-size-sm); color: var(--color-text-muted); }
    .student-item__remove { display: inline-flex; align-items: center; gap: 4px; padding: 4px 10px; border: 1px solid #f3c6c6; border-radius: var(--radius-md); background: #fff5f5; color: #c0392b; font-size: var(--font-size-sm); font-weight: 500; cursor: pointer; transition: background 0.15s, border-color 0.15s; }
    .student-item__remove:hover { background: #fde3e3; border-color: #e5a5a5; }
    .student-item__remove svg { width: 14px; height: 14px; }
    .course-type-badge { display: inline-block; padding: 2px 8px; border-radius: 20px; font-size: var(--font-size-xs); font-weight: 500; }
    .course-type-badge--dynamics { background: #ffedd4; color: #ca3500; }
    .course-type-badge--programming { background: #d0fae5; color: #007a55; }
    .course-type-badge--creative { background: #ede9fe; color: #7008e7; }
    .course-type-badge--default { background: #e8e8e8; color: #666; }

    /* 新增學生 Modal */
    .add-student-modal .modal__body { padding: 0; }
    .add-student-modal__banner { margin: var(--spacing-lg); padding: 12px 16px; background: #fffbea; border: 1px solid rgba(255, 219, 88, 0.3); border-radius: var(--radius-md); font-size: var(--font-size-sm); color: var(--color-text-muted); }
    .add-student-modal__banner strong { font-weight: 500; color: var(--color-text-primary); }
    .add-student-modal__search { display: flex; align-items: center; gap: var(--spacing-sm); margin: 0 var(--spacing-lg) var(--spacing-md); padding: 10px 12px; background: var(--color-background); border-radius: var(--radius-md); }
    .add-student-modal__search input { border: none; background: transparent; width: 100%; font-size: var(--font-size-md); color: var(--color-text-primary); }
    .add-student-modal__header { display: flex; align-items: center; justify-content: space-between; padding: 0 var(--spacing-lg) var(--spacing-md); }
    .add-student-modal__count { font-size: var(--font-size-sm); color: var(--color-text-muted); }
    .btn-link { background: none; border: none; font-size: var(--font-size-sm); font-weight: 500; color: #b8960a; cursor: pointer; }
    .btn-link:hover { text-decoration: underline; }
    .add-student-modal__list { padding: 0 var(--spacing-lg) var(--spacing-md); max-height: 300px; overflow-y: auto; }
    .student-checkbox-item { display: flex; align-items: center; gap: 12px; padding: 12px 14px; background: var(--color-background); border: 1px solid var(--color-surface-alt); border-radius: var(--radius-md); margin-bottom: 6px; cursor: pointer; transition: all 0.2s; }
    .student-checkbox-item:hover { background: var(--color-surface-alt); }
    .student-checkbox-item.selected { background: rgba(255, 219, 88, 0.1); border-color: var(--color-primary); }
    /* 已在班級的學生：可取消勾選以移出班級 */
    .student-checkbox-item.enrolled { background: #ecfdf3; border-color: #b7e8c9; }
    .student-checkbox-item.enrolled .student-checkbox-item__name::after { content: '已在班級'; margin-left: 8px; padding: 1px 6px; border-radius: 20px; background: #d0fae5; color: #007a55; font-size: var(--font-size-xs); font-weight: 500; }
    .student-checkbox-item.to-remove { background: #fff5f5; border-color: #f3c6c6; }
    .student-checkbox-item.to-remove .student-checkbox-item__name { text-decoration: line-through; color: var(--color-text-muted); }
    .student-checkbox-item.to-remove .student-checkbox-item__name::after { content: '將移出班級'; background: #fde3e3; color: #c0392b; }
    .student-checkbox-item input[type="checkbox"] { width: 16px; height: 16px; cursor: pointer; }
    .student-checkbox-item__info { flex: 1; }
    .student-checkbox-item__name { font-size: var(--font-size-md); font-weight: 500; color: var(--color-text-primary); }
    .student-checkbox-item__detail { font-size: var(--font-size-sm); color: var(--color-text-muted); }
    .empty-students { text-align: center; padding: 40px 20px; color: var(--color-text-muted); }

    @media (max-width: 992px) { .staff-layout { grid-template-columns: 1fr; } .staff-sidebar { display: none; } }
  </style>
  <link rel="stylesheet" href="../css/schedule-board.css">
  <link rel="stylesheet" href="../css/admin-notifications.css">
</head>
<body>
  <div class="staff-layout">
    <aside class="staff-sidebar">
      <div class="staff-sidebar__header">智慧學習歷程系統</div>
      <div class="staff-sidebar__profile">
        <div class="staff-sidebar__avatar">管</div>
        <div class="staff-sidebar__info">
          <span class="staff-sidebar__name">系統管理員</span>
          <span class="staff-sidebar__role">行政人員</span>
        </div>
      </div>
      <nav class="staff-sidebar__nav">
        <a href="students.html" class="staff-sidebar__nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87"/><path d="M16 3.13a4 4 0 010 7.75"/></svg>學生管理</a>
        <a href="teachers.html" class="staff-sidebar__nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>老師與行政人員</a>
        <a href="logs.html" class="staff-sidebar__nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>日誌管理</a>
        <a href="courses.html" class="staff-sidebar__nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>課程資訊</a>
        <a href="schedule.html" class="staff-sidebar__nav-item staff-sidebar__nav-item--active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>課表排程</a>
        <a href="points.html" class="staff-sidebar__nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>點數管理</a>
        <a href="settings.html" class="staff-sidebar__nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 01-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06a1.65 1.65 0 001.82.33H9a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>系統設定</a>
      </nav>
      <div class="staff-sidebar__footer">
        <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
        <span id="currentDate">2026年6月15日</span>
      </div>
    </aside>

    <main class="staff-main">
      <header class="staff-header">
        <h1 class="staff-header__title">智慧學習歷程系統</h1>
        <div class="staff-header__actions">
          <button class="staff-header__icon-btn" data-notification-btn><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 01-3.46 0"/></svg></button>
          <div class="staff-header__avatar"><img src="https://api.dicebear.com/7.x/avataaars/svg?seed=staff" alt="頭像"></div>
        </div>
      </header>

      <div class="staff-content">
        <div id="scheduleBoard"></div>

        <div class="schedule-list" id="listView" hidden>
          <table>
            <thead>
              <tr>
                <th><button type="button" class="col-sort" data-key="day_of_week" onclick="sortCourseList('day_of_week')">星期 <span class="col-sort__ico">⇅</span></button></th>
                <th><button type="button" class="col-sort" data-key="course_name" onclick="sortCourseList('course_name')">課程名稱 <span class="col-sort__ico">⇅</span></button></th>
                <th><button type="button" class="col-sort" data-key="start_time" onclick="sortCourseList('start_time')">時間 <span class="col-sort__ico">⇅</span></button></th>
                <th><button type="button" class="col-sort" data-key="classroom_name" onclick="sortCourseList('classroom_name')">教室 <span class="col-sort__ico">⇅</span></button></th>
                <th><button type="button" class="col-sort" data-key="teacher_name" onclick="sortCourseList('teacher_name')">老師 <span class="col-sort__ico">⇅</span></button></th>
                <th class="col-actions">操作</th>
              </tr>
            </thead>
            <tbody id="courseListBody"></tbody>
          </table>
          <div class="pagination" id="courseListPagination"></div>
        </div>
      </div>
    </main>
  </div>

  <!-- 學生名單 Modal -->
  <div class="modal-overlay" id="studentListModal">
    <div class="modal student-list-modal">
      <div class="modal__header">
        <h3 class="modal__title" id="studentListTitle">學生名單</h3>
        <button class="modal__close" onclick="closeModal('studentListModal')">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <div class="modal__body">
        <div class="student-modal__info" id="studentListInfo"></div>
        <div class="student-modal__list" id="studentList"></div>
      </div>
    </div>
  </div>

  <!-- 新增學生 Modal -->
  <div class="modal-overlay" id="addStudentModal">
    <div class="modal add-student-modal">
      <div class="modal__header">
        <h3 class="modal__title" id="addStudentTitle">新增學生</h3>
        <button class="modal__close" onclick="closeModal('addStudentModal')">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <div class="modal__body">
        <div class="add-student-modal__banner" id="addStudentBanner"></div>
        <div class="add-student-modal__search">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" opacity="0.5"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
          <input type="text" id="addStudentSearch" placeholder="搜尋姓名或學校...">
        </div>
        <div class="add-student-modal__header">
          <span class="add-student-modal__count" id="selectedStudentCount">尚未變更</span>
          <button type="button" class="btn-link" onclick="selectAllClassStudents()">全選</button>
        </div>
        <div class="add-student-modal__list" id="availableStudentList"></div>
      </div>
      <div class="modal__footer">
        <button type="button" class="btn-secondary" onclick="closeModal('addStudentModal')">取消</button>
        <button type="button" class="btn-primary" onclick="enrollClassStudents()">儲存變更</button>
      </div>
    </div>
  </div>

  <!-- 調課 Modal -->
  <div class="modal-overlay" id="adjustmentModal">
    <div class="modal">
      <div class="modal__header">
        <h3 class="modal__title" id="adjustmentModalTitle">調課</h3>
        <button class="modal__close" onclick="closeModal('adjustmentModal')">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <div class="modal__body">
        <div class="modal__hint">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
          <span>調課為單次調整，不影響班級固定課表。若要永久修改時段，請至「課程資訊 → 班級管理」編輯班級。</span>
        </div>

        <div class="schedule-info" id="scheduleInfo" style="display: none;">
          <div class="schedule-info__title" id="scheduleInfoTitle"></div>
          <div class="schedule-info__detail" id="scheduleInfoDetail"></div>
        </div>

        <div class="form-group">
          <label>選擇要調整的課<span class="form-group__req">*</span></label>
          <select id="adjustScheduleId" onchange="onAdjustScheduleChange()">
            <option value="">請選擇課程名稱</option>
          </select>
        </div>

        <div class="form-group">
          <label>調課類型<span class="form-group__req">*</span></label>
          <div class="adjustment-type-btns">
            <div class="adjustment-type-btn active" data-type="time" onclick="setAdjustmentType('time')">時段</div>
            <div class="adjustment-type-btn" data-type="teacher" onclick="setAdjustmentType('teacher')">老師</div>
            <div class="adjustment-type-btn" data-type="time_teacher" onclick="setAdjustmentType('time_teacher')">時段及老師</div>
          </div>
        </div>

        <div class="form-row" id="fieldDateRow">
          <div class="form-group">
            <label>原課日期<span class="form-group__req">*</span></label>
            <input type="date" id="adjustOriginalDate">
          </div>
          <div class="form-group" id="fieldAdjustedDate">
            <label>調至日期<span class="form-group__req">*</span></label>
            <input type="date" id="adjustAdjustedDate">
          </div>
        </div>

        <div class="form-row" id="fieldTimeRow">
          <div class="form-group">
            <label>開始時間<span class="form-group__req">*</span></label>
            <input type="time" id="adjustStartTime">
          </div>
          <div class="form-group">
            <label>結束時間<span class="form-group__req">*</span></label>
            <input type="time" id="adjustEndTime">
          </div>
        </div>

        <div class="form-group" id="fieldSubTeacher" style="display: none;">
          <label>代課老師<span class="form-group__req">*</span></label>
          <select id="adjustSubTeacher">
            <option value="">請選擇代課老師</option>
          </select>
        </div>

        <div class="form-group">
          <label>備註（選填）</label>
          <textarea id="adjustReason" rows="2" placeholder="例：場地維修、老師出差…"></textarea>
        </div>

        <div class="form-error" id="adjustError"></div>
      </div>
      <div class="modal__footer">
        <button class="btn-secondary" onclick="closeModal('adjustmentModal')">取消</button>
        <button class="btn-primary" id="adjustSubmitBtn" onclick="saveAdjustment()">確認調課</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <script>window.axios || document.write('<script src="../js/axios.min.js"><\/script>')</script>
  <script src="../js/api.js"></script>
  <script src="../js/main.js"></script>
  <script src="../js/schedule-board.js"></script>
  <script>
    // 狀態
    let board = null;              // 課表看板（js/schedule-board.js）
    let schedules = [];
    let currentAdjustmentType = 'time'; // 'time'=改時段；'teacher'=換代課老師；'time_teacher'=兩者皆調

    // 課表 / 課程列表 檢視
    let scheduleView = 'calendar';
    let courseListSort = { key: 'day_of_week', dir: 'asc' };
    let courseListPage = 1;
    const COURSE_LIST_PAGE_SIZE = 12;

    // 初始化
    document.addEventListener('DOMContentLoaded', () => {
      const now = new Date();
      document.getElementById('currentDate').textContent = `${now.getFullYear()}年${now.getMonth() + 1}月${now.getDate()}日`;

      board = ScheduleBoard.mount(document.getElementById('scheduleBoard'), {
        title: '課表排程',
        showAdjustButton: true,
        showViewToggle: true,
        onAdjustClick: () => openAdjustmentModal(),
        onBlockClick: openScheduleDetail,
        onViewChange: onScheduleViewChange,
        onFiltersLoaded: loadAdjustmentOptions
      });
    });

    const DAY_NAMES = ScheduleBoard.DAY_NAMES;

    // 載入調課 Modal 的選單（代課老師、要調整的課）
    async function loadAdjustmentOptions({ teachers }) {
      try {
        // 載入老師到「代課老師」選單
        const subTeacherSelect = document.getElementById('adjustSubTeacher');
        // 離職的老師不列入代課人選
        teachers.filter(t => !t.status || t.status === 'active').forEach(t => {
          subTeacherSelect.innerHTML += `<option value="${t.id}">${t.name}</option>`;
        });

        // 載入班級（課程時段）到「選擇要調整的課」選單
        const schedulesResult = await api.schedules.getAll();
        schedules = schedulesResult.data || [];
        const scheduleSelect = document.getElementById('adjustScheduleId');
        schedules.forEach(s => {
          const dayName = DAY_NAMES[s.day_of_week];
          const time = s.start_time ? s.start_time.substring(0, 5) : '';
          scheduleSelect.innerHTML += `<option value="${s.id}">${s.course_name} - ${dayName} ${time} (${s.teacher_name || '未指派'})</option>`;
        });
        if (scheduleView === 'list') renderCourseList();
      } catch (error) {
        console.error('載入調課選單失敗:', error);
      }
    }

    // ========== 課表 / 課程列表 切換（切換鈕與課表本身由 ScheduleBoard 處理） ==========
    function onScheduleViewChange(view) {
      scheduleView = view;
      document.getElementById('listView').hidden = view !== 'list';
      if (view === 'list') renderCourseList();
    }

    // ========== 課程列表 ==========
    const WEEKDAY_CH = ['日', '一', '二', '三', '四', '五', '六'];

    // 週日排在最後
    function weekdayOrder(dow) {
      return dow === 0 ? 7 : dow;
    }

    function sortCourseList(key) {
      if (courseListSort.key === key) {
        courseListSort.dir = courseListSort.dir === 'asc' ? 'desc' : 'asc';
      } else {
        courseListSort = { key, dir: 'asc' };
      }
      courseListPage = 1;
      renderCourseList();
    }

    function getSortedCourseList() {
      const { key, dir } = courseListSort;
      const factor = dir === 'asc' ? 1 : -1;
      return [...schedules].sort((a, b) => {
        let av, bv;
        if (key === 'day_of_week') {
          av = weekdayOrder(a.day_of_week); bv = weekdayOrder(b.day_of_week);
        } else if (key === 'start_time') {
          av = a.start_time || ''; bv = b.start_time || '';
        } else {
          av = a[key] || ''; bv = b[key] || '';
        }
        let cmp;
        if (typeof av === 'number' && typeof bv === 'number') {
          cmp = av - bv;
        } else {
          cmp = String(av).localeCompare(String(bv), 'zh-Hant');
        }
        // 次要排序：星期 → 時間，其餘 → 星期＋時間
        if (cmp === 0) {
          cmp = weekdayOrder(a.day_of_week) - weekdayOrder(b.day_of_week)
             || String(a.start_time || '').localeCompare(String(b.start_time || ''));
        }
        return cmp * factor;
      });
    }

    function updateSortIndicators() {
      document.querySelectorAll('#listView .col-sort').forEach(btn => {
        const active = btn.dataset.key === courseListSort.key;
        btn.classList.toggle('col-sort--active', active);
        btn.querySelector('.col-sort__ico').textContent = active
          ? (courseListSort.dir === 'asc' ? '▲' : '▼')
          : '⇅';
      });
    }

    function renderCourseList() {
      updateSortIndicators();

      const body = document.getElementById('courseListBody');
      const sorted = getSortedCourseList();
      const totalPages = Math.max(1, Math.ceil(sorted.length / COURSE_LIST_PAGE_SIZE));
      courseListPage = Math.min(Math.max(1, courseListPage), totalPages);
      const startIdx = (courseListPage - 1) * COURSE_LIST_PAGE_SIZE;
      const pageRows = sorted.slice(startIdx, startIdx + COURSE_LIST_PAGE_SIZE);

      if (!pageRows.length) {
        body.innerHTML = '<tr><td colspan="6" class="schedule-list__empty">目前沒有課程班級</td></tr>';
        renderCourseListPagination(1);
        return;
      }

      body.innerHTML = pageRows.map(s => {
        const start = s.start_time ? s.start_time.substring(0, 5) : '';
        const end = s.end_time ? s.end_time.substring(0, 5) : '';
        return `
          <tr>
            <td>${WEEKDAY_CH[s.day_of_week] ?? '-'}</td>
            <td>${s.course_name || '-'}</td>
            <td>${start && end ? `${start}–${end}` : '-'}</td>
            <td>${(s.classroom_name || '-')}</td>
            <td>${s.teacher_name || '未指派'}</td>
            <td class="col-actions">
              <div class="class-actions">
                <button type="button" title="學生列表" onclick="openClassStudentList(${s.id})">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87"/><path d="M16 3.13a4 4 0 010 7.75"/></svg>
                </button>
                <button type="button" title="新增學生" onclick="openClassAddStudent(${s.id})">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="8.5" cy="7" r="4"/><line x1="20" y1="8" x2="20" y2="14"/><line x1="23" y1="11" x2="17" y2="11"/></svg>
                </button>
              </div>
            </td>
          </tr>
        `;
      }).join('');

      renderCourseListPagination(totalPages);
    }

    function renderCourseListPagination(totalPages) {
      const el = document.getElementById('courseListPagination');
      if (totalPages <= 1) { el.innerHTML = ''; return; }
      let html = `<button class="pagination__btn" ${courseListPage <= 1 ? 'disabled' : ''} onclick="gotoCourseListPage(${courseListPage - 1})">&lt;</button>`;
      for (let p = 1; p <= totalPages; p++) {
        html += `<button class="pagination__btn${p === courseListPage ? ' pagination__btn--active' : ''}" onclick="gotoCourseListPage(${p})">${p}</button>`;
      }
      html += `<button class="pagination__btn" ${courseListPage >= totalPages ? 'disabled' : ''} onclick="gotoCourseListPage(${courseListPage + 1})">&gt;</button>`;
      el.innerHTML = html;
    }

    function gotoCourseListPage(p) {
      courseListPage = p;
      renderCourseList();
    }

    // ========== 學生名單 / 新增學生 Modal（沿用班級管理流程） ==========
    let currentClassScheduleId = null;
    let availableClassStudents = [];

    function courseTypeBadgeClass(typeName) {
      if (!typeName) return 'course-type-badge--default';
      if (typeName.includes('動力')) return 'course-type-badge--dynamics';
      if (typeName.includes('程式')) return 'course-type-badge--programming';
      if (typeName.includes('科創')) return 'course-type-badge--creative';
      return 'course-type-badge--default';
    }

    function courseTypeShortName(typeName) {
      if (!typeName) return '';
      if (typeName.includes('動力')) return '動力';
      if (typeName.includes('程式')) return '程式';
      if (typeName.includes('科創')) return '科創';
      if (typeName.includes('幼兒')) return '幼兒';
      if (typeName.includes('專題')) return '專題';
      return typeName.substring(0, 2);
    }

    async function openClassStudentList(scheduleId) {
      currentClassScheduleId = scheduleId;
      document.getElementById('studentListModal').classList.add('active');
      document.getElementById('studentList').innerHTML = '<div class="empty-students">載入中...</div>';

      try {
        const result = await api.schedules.getStudents(scheduleId);
        const { schedule, students } = result.data;
        const start = schedule.start_time ? schedule.start_time.substring(0, 5) : '';
        const end = schedule.end_time ? schedule.end_time.substring(0, 5) : '';

        document.getElementById('studentListTitle').textContent = `${schedule.course_name} — 學生名單`;
        document.getElementById('studentListInfo').innerHTML = `
          <span>老師：${schedule.teacher_name || '未指派'}</span>
          <span>教室：${(schedule.classroom_name || '未指定')}</span>
          <span>時間：${WEEKDAY_CH[schedule.day_of_week] ?? ''} ${start}–${end}</span>
        `;

        const listEl = document.getElementById('studentList');
        if (!students.length) {
          listEl.innerHTML = '<div class="empty-students">目前沒有學生，請點擊「新增學生」加入。</div>';
          return;
        }
        listEl.innerHTML = students.map(st => {
          const safeName = (st.name || '').replace(/"/g, '&quot;');
          return `
          <div class="student-item" data-student-id="${st.id}">
            <div class="student-item__left">
              <div class="student-item__avatar">${(st.name || '').charAt(0)}</div>
              <span class="student-item__name">${st.name || '-'}</span>
            </div>
            <div class="student-item__right">
              ${st.course_type_name ? `<span class="course-type-badge ${courseTypeBadgeClass(st.course_type_name)}">${courseTypeShortName(st.course_type_name)}</span>` : ''}
              <span class="student-item__school">${st.school || ''}</span>
              <button type="button" class="student-item__remove" title="從班級移除" onclick="removeClassStudent(${st.id}, &quot;${safeName}&quot;)">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <polyline points="3 6 5 6 21 6"/>
                  <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
                </svg>
                移除
              </button>
            </div>
          </div>
        `;
      }).join('');
      } catch (error) {
        console.error('載入學生名單失敗:', error);
        document.getElementById('studentList').innerHTML = '<div class="empty-students">載入失敗</div>';
      }
    }

    // 從班級移除單一學生（加錯學生時可修正）
    async function removeClassStudent(studentId, studentName) {
      if (!currentClassScheduleId) return;
      if (!confirm(`確定要將「${studentName || '這位學生'}」從此班級移除嗎？`)) return;

      try {
        const result = await api.schedules.removeStudent(currentClassScheduleId, studentId);
        if (result.success) {
          if (typeof showMessage === 'function') showMessage(result.message || '學生已從班級移除', 'success');
          await openClassStudentList(currentClassScheduleId); // 重新載入名單
          const fresh = await api.schedules.getAll();
          schedules = fresh.data || [];
          if (scheduleView === 'list') renderCourseList();
        }
      } catch (error) {
        if (typeof showMessage === 'function') showMessage('移除學生失敗：' + (error.response?.data?.message || '未知錯誤'), 'error');
      }
    }

    async function openClassAddStudent(scheduleId) {
      currentClassScheduleId = scheduleId;
      document.getElementById('addStudentSearch').value = '';
      document.getElementById('addStudentModal').classList.add('active');
      await loadAvailableClassStudents(scheduleId);
    }

    async function loadAvailableClassStudents(scheduleId, search = '') {
      try {
        const result = await api.schedules.getAvailableStudents(scheduleId, search ? { search } : {});
        const { schedule, students } = result.data;
        availableClassStudents = students;

        document.getElementById('addStudentTitle').textContent = `新增學生 — ${schedule.course_name}`;
        document.getElementById('addStudentBanner').innerHTML =
          `${schedule.teacher_name || '未指派'} 授課・${(schedule.classroom_name || '未指定')}・現有 <strong>${schedule.student_count || 0}</strong> 名學生`;
        renderAvailableClassStudents();
      } catch (error) {
        console.error('載入可選學生失敗:', error);
        document.getElementById('availableStudentList').innerHTML = '<div class="empty-students">載入失敗</div>';
      }
    }

    function renderAvailableClassStudents() {
      const listEl = document.getElementById('availableStudentList');
      if (!availableClassStudents.length) {
        listEl.innerHTML = '<div class="empty-students">沒有可加入的學生</div>';
        updateClassSelectedCount();
        return;
      }
      listEl.innerHTML = availableClassStudents.map(st => {
        const enrolled = st.is_enrolled === 1;
        return `
          <label class="student-checkbox-item ${enrolled ? 'enrolled' : ''}" data-student-id="${st.id}" data-enrolled="${enrolled ? '1' : '0'}">
            <input type="checkbox" value="${st.id}" ${enrolled ? 'checked' : ''}>
            <div class="student-checkbox-item__info">
              <div class="student-checkbox-item__name">${st.name || '-'}</div>
              <div class="student-checkbox-item__detail">${st.school || ''} ${st.grade || ''}</div>
            </div>
            ${st.course_type_name ? `<span class="course-type-badge ${courseTypeBadgeClass(st.course_type_name)}">${courseTypeShortName(st.course_type_name)}</span>` : ''}
          </label>
        `;
      }).join('');

      // 綁定 checkbox 變更事件：已在班級的學生取消勾選即代表要移出班級
      listEl.querySelectorAll('input[type="checkbox"]').forEach(cb => {
        cb.addEventListener('change', function () {
          const label = this.closest('.student-checkbox-item');
          const wasEnrolled = label.dataset.enrolled === '1';
          label.classList.toggle('selected', this.checked && !wasEnrolled);
          label.classList.toggle('to-remove', !this.checked && wasEnrolled);
          updateClassSelectedCount();
        });
      });
      updateClassSelectedCount();
    }

    // 計算相對於目前班級名單的變更（新增 / 移出）
    function getClassStudentChanges() {
      const toAdd = [];
      const toRemove = [];
      document.querySelectorAll('#availableStudentList .student-checkbox-item').forEach(label => {
        const cb = label.querySelector('input[type="checkbox"]');
        if (!cb) return;
        const id = parseInt(cb.value);
        const wasEnrolled = label.dataset.enrolled === '1';
        if (cb.checked && !wasEnrolled) toAdd.push(id);
        if (!cb.checked && wasEnrolled) toRemove.push(id);
      });
      return { toAdd, toRemove };
    }

    function updateClassSelectedCount() {
      const { toAdd, toRemove } = getClassStudentChanges();
      const el = document.getElementById('selectedStudentCount');
      if (!toAdd.length && !toRemove.length) {
        el.textContent = '尚未變更';
        return;
      }
      const parts = [];
      if (toAdd.length) parts.push(`新增 ${toAdd.length} 位`);
      if (toRemove.length) parts.push(`移出 ${toRemove.length} 位`);
      el.textContent = parts.join('・');
    }

    function selectAllClassStudents() {
      document.querySelectorAll('#availableStudentList .student-checkbox-item').forEach(label => {
        const cb = label.querySelector('input[type="checkbox"]');
        if (!cb) return;
        cb.checked = true;
        label.classList.remove('to-remove');
        if (label.dataset.enrolled !== '1') label.classList.add('selected');
      });
      updateClassSelectedCount();
    }

    async function enrollClassStudents() {
      const { toAdd, toRemove } = getClassStudentChanges();

      if (!toAdd.length && !toRemove.length) {
        if (typeof showMessage === 'function') showMessage('沒有任何變更', 'error');
        return;
      }

      if (toRemove.length > 0 &&
          !confirm(`將有 ${toRemove.length} 位學生被移出此班級，確定套用變更？`)) {
        return;
      }

      try {
        if (toAdd.length > 0) {
          await api.schedules.enrollStudents(currentClassScheduleId, toAdd);
        }
        for (const sid of toRemove) {
          await api.schedules.removeStudent(currentClassScheduleId, sid);
        }
        if (typeof showMessage === 'function') showMessage('班級學生已更新', 'success');
        closeModal('addStudentModal');
        const fresh = await api.schedules.getAll();
        schedules = fresh.data || [];
        if (scheduleView === 'list') renderCourseList();
      } catch (error) {
        if (typeof showMessage === 'function') showMessage('更新學生失敗：' + (error.response?.data?.message || '未知錯誤'), 'error');
      }
    }

    // 搜尋（新增學生 Modal）
    let classStudentSearchTimer = null;
    document.getElementById('addStudentSearch').addEventListener('input', function () {
      clearTimeout(classStudentSearchTimer);
      const search = this.value.trim();
      classStudentSearchTimer = setTimeout(() => loadAvailableClassStudents(currentClassScheduleId, search), 300);
    });

    // 點背景關閉
    document.getElementById('studentListModal').addEventListener('click', function (e) {
      if (e.target === this) closeModal('studentListModal');
    });
    document.getElementById('addStudentModal').addEventListener('click', function (e) {
      if (e.target === this) closeModal('addStudentModal');
    });

    // 開啟課程詳情（點課表方塊）→ 開啟調課 Modal 並帶入該堂課
    async function openScheduleDetail(schedule) {
      // 已調課的課：同一堂課不能重複調課，改為詢問是否取消這次調課（恢復原課表）後再重新設定
      if (schedule.is_adjusted && schedule.adjustment_id) {
        const typeLabels = { time: '調時段', teacher: '代課', time_teacher: '調時段及代課', reschedule: '改期', makeup: '補課', cancel: '停課' };
        const detail = [
          typeLabels[schedule.adjustment_type] || '調課',
          schedule.original_date ? `原課日 ${String(schedule.original_date).substring(0, 10)}` : '',
          schedule.adjustment_reason ? `原因：${schedule.adjustment_reason}` : ''
        ].filter(Boolean).join('｜');
        if (!confirm(`「${schedule.course_name}」這堂課已調課（${detail}）。\n\n要取消這次調課、恢復原本的課表嗎？\n取消後可以重新設定調課。`)) return;
        try {
          await api.scheduleCalendar.adjustments.delete(schedule.adjustment_id);
          showMessage('已取消調課，恢復原本的課表', 'success');
          await board.reload();
        } catch (error) {
          showMessage('取消調課失敗：' + (error.response?.data?.message || '未知錯誤'), 'error');
        }
        return;
      }
      openAdjustmentModal(schedule);
    }

    // 取得「今天（含）之後第一個符合指定星期」的日期（yyyy-mm-dd）
    function nextDateForWeekday(dow) {
      const d = new Date();
      d.setHours(0, 0, 0, 0);
      const diff = (dow - d.getDay() + 7) % 7;
      d.setDate(d.getDate() + diff);
      return ScheduleBoard.formatDateISO(d);
    }

    // 依 schedule_id 取得已載入的班級時段資料
    function findSchedule(id) {
      return schedules.find(s => String(s.id) === String(id)) || null;
    }

    function setAdjustError(msg) {
      document.getElementById('adjustError').textContent = msg || '';
    }

    // 重置調課表單
    function resetAdjustmentForm() {
      document.getElementById('adjustScheduleId').value = '';
      document.getElementById('adjustOriginalDate').value = '';
      document.getElementById('adjustAdjustedDate').value = '';
      document.getElementById('adjustStartTime').value = '';
      document.getElementById('adjustEndTime').value = '';
      document.getElementById('adjustSubTeacher').value = '';
      document.getElementById('adjustReason').value = '';
      document.getElementById('scheduleInfo').style.display = 'none';
      setAdjustError('');
      setAdjustmentType('time');
    }

    // 選擇要調整的課 → 自動帶入原時段與最近一次上課日期
    function onAdjustScheduleChange() {
      const s = findSchedule(document.getElementById('adjustScheduleId').value);
      const info = document.getElementById('scheduleInfo');
      if (!s) { info.style.display = 'none'; return; }

      const start = s.start_time ? s.start_time.substring(0, 5) : '';
      const end = s.end_time ? s.end_time.substring(0, 5) : '';

      if (!document.getElementById('adjustOriginalDate').value) {
        document.getElementById('adjustOriginalDate').value = nextDateForWeekday(s.day_of_week);
      }
      if (!document.getElementById('adjustStartTime').value) document.getElementById('adjustStartTime').value = start;
      if (!document.getElementById('adjustEndTime').value) document.getElementById('adjustEndTime').value = end;

      info.style.display = 'block';
      document.getElementById('scheduleInfoTitle').textContent = s.course_name;
      document.getElementById('scheduleInfoDetail').textContent =
        `${DAY_NAMES[s.day_of_week]} ${start}-${end} | ${s.teacher_name || '未指派'} | ${s.classroom_name || '未指定教室'}`;
      setAdjustError('');
    }

    // 開啟調課 Modal（schedule：由課表方塊點入時帶入的該堂課資料）
    function openAdjustmentModal(schedule = null) {
      resetAdjustmentForm();

      if (schedule) {
        document.getElementById('adjustScheduleId').value = schedule.schedule_id;
        document.getElementById('adjustOriginalDate').value = schedule.date || board.getCurrentDateISO();
        document.getElementById('adjustStartTime').value = schedule.start_time ? schedule.start_time.substring(0, 5) : '';
        document.getElementById('adjustEndTime').value = schedule.end_time ? schedule.end_time.substring(0, 5) : '';
        onAdjustScheduleChange();
      }

      document.getElementById('adjustmentModal').classList.add('active');
    }

    // 關閉 Modal
    function closeModal(modalId) {
      document.getElementById(modalId).classList.remove('active');
    }

    // 設置調課類型，並依類型顯示對應欄位
    function setAdjustmentType(type) {
      currentAdjustmentType = type;
      document.querySelectorAll('.adjustment-type-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.type === type);
      });

      const withTime = type === 'time' || type === 'time_teacher';
      const withTeacher = type === 'teacher' || type === 'time_teacher';

      document.getElementById('fieldAdjustedDate').style.display = withTime ? '' : 'none';
      document.getElementById('fieldDateRow').classList.toggle('form-row--single', !withTime);
      document.getElementById('fieldTimeRow').style.display = withTime ? '' : 'none';
      document.getElementById('fieldSubTeacher').style.display = withTeacher ? '' : 'none';
      setAdjustError('');
    }

    // 儲存調課
    async function saveAdjustment() {
      const btn = document.getElementById('adjustSubmitBtn');
      const scheduleId = document.getElementById('adjustScheduleId').value;
      const originalDate = document.getElementById('adjustOriginalDate').value;
      const type = currentAdjustmentType;
      const withTime = type === 'time' || type === 'time_teacher';
      const withTeacher = type === 'teacher' || type === 'time_teacher';

      const s = findSchedule(scheduleId);
      setAdjustError('');

      if (!scheduleId || !originalDate) {
        setAdjustError('請選擇要調整的課與原課日期');
        return;
      }
      if (s && new Date(originalDate + 'T00:00:00').getDay() !== s.day_of_week) {
        setAdjustError(`原課日期須為${DAY_NAMES[s.day_of_week]}（該班固定上課日）`);
        return;
      }

      const data = {
        schedule_id: parseInt(scheduleId),
        original_date: originalDate,
        adjustment_type: type,
        reason: document.getElementById('adjustReason').value.trim() || null
      };

      if (withTime) {
        const adjustedDate = document.getElementById('adjustAdjustedDate').value;
        const startTime = document.getElementById('adjustStartTime').value;
        const endTime = document.getElementById('adjustEndTime').value;
        if (!adjustedDate || !startTime || !endTime) {
          setAdjustError('請填寫調至日期與開始／結束時間');
          return;
        }
        if (endTime <= startTime) {
          setAdjustError('結束時間須晚於開始時間');
          return;
        }
        data.adjusted_date = adjustedDate;
        data.adjusted_start_time = startTime;
        data.adjusted_end_time = endTime;
      }

      if (withTeacher) {
        const subTeacherId = document.getElementById('adjustSubTeacher').value;
        if (!subTeacherId) {
          setAdjustError('請選擇代課老師');
          return;
        }
        if (s && String(subTeacherId) === String(s.teacher_id)) {
          setAdjustError('代課老師與原老師相同');
          return;
        }
        data.adjusted_teacher_id = parseInt(subTeacherId);
      }

      btn.disabled = true;
      try {
        await api.scheduleCalendar.adjustments.create(data);
        closeModal('adjustmentModal');
        showMessage('調課已建立（點選該堂課可取消調課）', 'success');
        await board.reload();
      } catch (error) {
        setAdjustError('調課建立失敗：' + (error.response?.data?.message || '未知錯誤'));
      } finally {
        btn.disabled = false;
      }
    }

    // 點擊背景關閉 Modal
    document.getElementById('adjustmentModal').addEventListener('click', function(e) {
      if (e.target === this) closeModal('adjustmentModal');
    });
  </script>
  <script src="../js/admin-notifications.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>課表 - 智慧學習歷程系統</title>
  <link rel="stylesheet" href="../css/styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    /* 版面 Grid 佈局 */
    html, body {
      margin: 0;
      height: 100%;
    }

    .dashboard {
      display: grid;
      grid-template-columns: 220px 1fr;
      grid-template-rows: 68px 1fr;
      grid-template-areas:
        "sidebar header"
        "sidebar main";
      height: 100vh;
      overflow: hidden;
    }

    .sidebar {
      grid-area: sidebar;
      padding: var(--spacing-lg) 0;
      overflow-y: auto;
    }

    .header {
      grid-area: header;
      background: var(--color-surface);
      border-bottom: 1px solid var(--color-surface-alt);
      padding: var(--spacing-md) var(--spacing-lg);
    }

    .main-content {
      grid-area: main;
      overflow-y: auto;
      height: 100%;
    }

    .header__avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: 2px solid var(--color-primary);
      overflow: hidden;
    }

    .header__icon-btn {
      position: relative;
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: var(--radius-md);
      color: var(--color-text-secondary);
      cursor: pointer;
      transition: background 0.2s;
    }

    .header__icon-btn:hover {
      background: var(--color-surface-alt);
    }

    /* 頁面標題區 */
    .page-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: var(--spacing-xl);
      padding-bottom: var(--spacing-lg);
    }

    .page-header__info {
      display: flex;
      flex-direction: column;
      gap: var(--spacing-xs);
    }

    .page-header__title {
      font-size: 28px;
      font-weight: 700;
      color: var(--color-text-primary);
    }

    .page-header__subtitle {
      font-size: var(--font-size-md);
      color: var(--color-text-muted);
    }

    /* 篩選列 */
    .schedule-filters {
      display: flex;
      align-items: center;
      gap: var(--spacing-md);
      padding: 0 var(--spacing-xl) var(--spacing-lg);
      flex-wrap: wrap;
    }

    .filter-select {
      padding: 8px 16px;
      background: var(--color-surface);
      border: 1px solid var(--color-surface-alt);
      border-radius: var(--radius-md);
      font-size: var(--font-size-sm);
      color: var(--color-text-primary);
      cursor: pointer;
    }

    .date-nav {
      display: flex;
      align-items: center;
      gap: var(--spacing-sm);
    }

    .date-nav__btn {
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--color-surface);
      border: 1px solid var(--color-surface-alt);
      border-radius: var(--radius-sm);
      cursor: pointer;
      color: var(--color-text-secondary);
      transition: all 0.2s;
    }

    .date-nav__btn:hover {
      background: var(--color-surface-alt);
    }

    .date-nav__current {
      padding: 8px 16px;
      background: var(--color-surface);
      border: 1px solid var(--color-surface-alt);
      border-radius: var(--radius-md);
      font-size: var(--font-size-sm);
      color: var(--color-text-primary);
      min-width: 200px;
      text-align: center;
      font-weight: 500;
    }

    .date-nav__input {
      padding: 8px 12px;
      background: var(--color-surface);
      border: 1px solid var(--color-surface-alt);
      border-radius: var(--radius-md);
      font-size: var(--font-size-sm);
      color: var(--color-text-primary);
    }

    .btn-secondary {
      padding: 8px 16px;
      background: var(--color-surface);
      border: 1px solid var(--color-surface-alt);
      border-radius: var(--radius-md);
      font-size: var(--font-size-sm);
      color: var(--color-text-secondary);
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-secondary:hover {
      background: var(--color-surface-alt);
    }

    .weekday-tabs {
      display: flex;
      gap: 4px;
      margin-left: auto;
    }

    .weekday-tab {
      width: 44px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--color-surface);
      border: 1px solid var(--color-surface-alt);
      border-radius: var(--radius-sm);
      font-size: var(--font-size-sm);
      color: var(--color-text-secondary);
      cursor: pointer;
      transition: all 0.2s;
    }

    .weekday-tab:hover {
      background: var(--color-background);
    }

    .weekday-tab--active {
      background: var(--color-primary);
      border-color: var(--color-primary);
      color: var(--color-primary-dark);
      font-weight: 500;
    }

    /* 課表容器 */
    .schedule-container {
      padding: 0 var(--spacing-xl) var(--spacing-xl);
      overflow-x: auto;
    }

    .schedule-grid {
      background: var(--color-surface);
      border-radius: var(--radius-lg);
      overflow: hidden;
      box-shadow: var(--shadow-sm);
    }

    .schedule-header {
      display: grid;
      border-bottom: 1px solid var(--color-surface-alt);
    }

    .schedule-header__cell {
      padding: var(--spacing-md) var(--spacing-sm);
      text-align: center;
      font-size: var(--font-size-md);
      font-weight: 500;
      color: var(--color-text-primary);
      border-right: 1px dashed var(--color-surface-alt);
      background: var(--color-background);
    }

    .schedule-header__cell:first-child {
      border-right: 1px solid var(--color-surface-alt);
      background: var(--color-surface);
    }

    .schedule-header__cell:last-child {
      border-right: none;
    }

    .schedule-header__cell--current {
      background: rgba(255, 219, 88, 0.3);
      color: var(--color-primary-dark);
    }

    .schedule-body {
      display: grid;
    }

    .schedule-time {
      padding: var(--spacing-sm);
      font-size: var(--font-size-sm);
      color: var(--color-text-primary);
      border-right: 1px solid var(--color-surface-alt);
      border-bottom: 1px dashed var(--color-surface-alt);
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      justify-content: flex-start;
      background: var(--color-surface);
      min-height: 50px;
    }

    .schedule-time__main {
      font-weight: 500;
    }

    .schedule-time__sub {
      font-size: var(--font-size-xs);
      color: var(--color-text-muted);
    }

    .schedule-cell {
      position: relative;
      min-height: 50px;
      border-right: 1px dashed var(--color-surface-alt);
      border-bottom: 1px dashed var(--color-surface-alt);
      background: var(--color-surface);
    }

    .schedule-cell:last-child {
      border-right: none;
    }

    .schedule-cell--current {
      background: rgba(255, 219, 88, 0.08);
    }

    /* 課程方塊 */
    .schedule-block {
      position: absolute;
      left: 2px;
      right: 2px;
      padding: 6px 8px;
      border-radius: var(--radius-sm);
      font-size: var(--font-size-xs);
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      z-index: 1;
    }

    .schedule-block:hover {
      transform: scale(1.02);
      box-shadow: var(--shadow-md);
      z-index: 10;
    }

    .schedule-block--yellow {
      background: rgba(255, 219, 88, 0.35);
      border-left: 3px solid #ffdb58;
    }

    .schedule-block--orange {
      background: rgba(255, 183, 120, 0.35);
      border-left: 3px solid #ffb778;
    }

    .schedule-block--purple {
      background: rgba(200, 180, 255, 0.35);
      border-left: 3px solid #c8b4ff;
    }

    .schedule-block--blue {
      background: rgba(135, 206, 250, 0.35);
      border-left: 3px solid #87CEEB;
    }

    .schedule-block--green {
      background: rgba(144, 238, 144, 0.35);
      border-left: 3px solid #90EE90;
    }

    .schedule-block--adjusted {
      border-style: dashed;
    }

    .schedule-block__title {
      font-weight: 500;
      color: var(--color-text-primary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .schedule-block__location {
      color: var(--color-text-muted);
      margin-top: 2px;
    }

    .schedule-block__teacher {
      color: var(--color-text-secondary);
      margin-top: 2px;
    }

    .schedule-block__badge {
      position: absolute;
      top: 2px;
      right: 2px;
      padding: 1px 4px;
      font-size: 9px;
      background: #ff6b6b;
      color: white;
      border-radius: 2px;
    }

    /* 載入中 */
    .loading {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: var(--spacing-xl);
      color: var(--color-text-muted);
      grid-column: 1 / -1;
      min-height: 300px;
    }

    /* 響應式 */
    @media (max-width: 992px) {
      .schedule-filters {
        flex-direction: column;
        align-items: flex-start;
      }

      .weekday-tabs {
        margin-left: 0;
        margin-top: var(--spacing-md);
      }
    }
  </style>
</head>

  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/main.js"></script>
  <script>
    // 狀態
    let currentDate = new Date();
    let currentDayOfWeek = currentDate.getDay();
    let teachers = [];
    let classrooms = [];
    let currentUserId = null;

    // 初始化
    document.addEventListener('DOMContentLoaded', async () => {
      const token = localStorage.getItem('authToken');
      if (!token) {
        window.location.href = '../login.html';
        return;
      }

      await loadUserInfo();
      updateCurrentDateDisplay();
      await loadFilters();
      await loadSchedule();
      setupWeekdayTabs();
    });

    // 載入使用者資訊
    async function loadUserInfo() {
      try {
        const response = await api.auth.getProfile();
        if (response.success && response.data) {
          const userName = response.data.name || response.data.username || '老師';
          document.getElementById('sidebarUserName').textContent = userName + ' 老師';
          currentUserId = response.data.id;
        }
      } catch (error) {
        console.warn('載入使用者資訊失敗:', error);
      }
    }

    // 更新日期顯示
    function updateCurrentDateDisplay() {
      const weekStart = getWeekStart(currentDate);
      const weekEnd = new Date(weekStart);
      weekEnd.setDate(weekStart.getDate() + 6);
      document.getElementById('weekDisplay').textContent =
        `${formatDate(weekStart)} ~ ${formatDate(weekEnd)}`;
      document.getElementById('datePicker').value = formatDateISO(currentDate);
    }

    // 取得週一日期
    function getWeekStart(date) {
      const d = new Date(date);
      const day = d.getDay();
      const diff = d.getDate() - day + (day === 0 ? -6 : 1);
      return new Date(d.setDate(diff));
    }

    // 格式化日期
    function formatDate(date) {
      return `${date.getFullYear()}/${String(date.getMonth() + 1).padStart(2, '0')}/${String(date.getDate()).padStart(2, '0')}`;
    }

    function formatDateISO(date) {
      return date.toISOString().split('T')[0];
    }

    // 載入篩選器選項
    async function loadFilters() {
      try {
        // 載入老師
        const teachersResult = await api.teachers.getAll();
        teachers = teachersResult.data || [];
        const teacherSelect = document.getElementById('filterTeacher');
        teachers.forEach(t => {
          teacherSelect.innerHTML += `<option value="${t.id}">${t.name}</option>`;
        });

        // 載入教室
        const classroomsResult = await api.schedules.getClassrooms();
        classrooms = classroomsResult.data || [];
        const classroomSelect = document.getElementById('filterClassroom');
        classrooms.forEach(c => {
          classroomSelect.innerHTML += `<option value="${c.id}">${c.name}</option>`;
        });
      } catch (error) {
        console.error('載入篩選器失敗:', error);
      }
    }

    // 載入課表
    async function loadSchedule() {
      const scheduleBody = document.getElementById('scheduleBody');
      const scheduleHeader = document.getElementById('scheduleHeader');
      scheduleBody.innerHTML = '<div class="loading">載入中...</div>';

      try {
        const teacherId = document.getElementById('filterTeacher').value;
        const classroomId = document.getElementById('filterClassroom').value;

        const result = await api.scheduleCalendar.getDaily({
          date: formatDateISO(currentDate),
          teacher_id: teacherId || undefined,
          classroom_id: classroomId || undefined
        });

        const data = result.data;
        const teacherList = data.teachers.filter(t => t.schedules.length > 0 || !teacherId);

        // 如果沒有選擇特定老師，顯示所有有排課的老師
        const displayTeachers = teacherId ? teacherList : teacherList.slice(0, 7);

        // 生成表頭
        const cols = displayTeachers.length + 1;
        scheduleHeader.style.gridTemplateColumns = `60px repeat(${displayTeachers.length}, 1fr)`;
        scheduleHeader.innerHTML = '<div class="schedule-header__cell"></div>' +
          displayTeachers.map(t => {
            const isCurrentUser = t.teacher_id === currentUserId;
            return `<div class="schedule-header__cell ${isCurrentUser ? 'schedule-header__cell--current' : ''}">${t.teacher_name}</div>`;
          }).join('');

        // 生成課表內容
        scheduleBody.style.gridTemplateColumns = `60px repeat(${displayTeachers.length}, 1fr)`;
        scheduleBody.innerHTML = '';

        const times = ['09:00', '10:00', '11:00', '12:00', '13:00', '14:00', '15:00', '16:00', '17:00', '18:00', '19:00', '20:00', '21:00'];

        times.forEach((time, index) => {
          const hour = parseInt(time);

          // 時間欄
          const timeCell = document.createElement('div');
          timeCell.className = 'schedule-time';
          timeCell.innerHTML = `<span class="schedule-time__main">${time}</span><span class="schedule-time__sub">${hour}:30</span>`;
          scheduleBody.appendChild(timeCell);

          // 老師欄位
          displayTeachers.forEach((teacher, tIndex) => {
            const isCurrentUser = teacher.teacher_id === currentUserId;
            const cell = document.createElement('div');
            cell.className = `schedule-cell ${isCurrentUser ? 'schedule-cell--current' : ''}`;

            // 找這個老師在這個時間的課程
            teacher.schedules.forEach(schedule => {
              const startHour = parseInt(schedule.start_time.split(':')[0]);
              const endHour = parseInt(schedule.end_time.split(':')[0]);

              if (startHour === hour) {
                const duration = endHour - startHour;
                const block = document.createElement('div');
                const colorClass = getColorClass(schedule.course_type_name || schedule.course_name);
                block.className = `schedule-block schedule-block--${colorClass}${schedule.is_adjusted ? ' schedule-block--adjusted' : ''}`;
                block.style.top = '2px';
                block.style.height = `${duration * 50 - 4}px`;

                const locationName = schedule.classroom_name ? `[${schedule.classroom_name.replace('教室', '')}]` : '';
                block.innerHTML = `
                  <div class="schedule-block__title">${schedule.course_name} ${locationName}</div>
                  <div class="schedule-block__teacher">${schedule.teacher_name || ''}</div>
                  ${schedule.is_adjusted ? '<span class="schedule-block__badge">調</span>' : ''}
                `;

                block.onclick = () => openScheduleDetail(schedule);
                cell.appendChild(block);
              }
            });

            scheduleBody.appendChild(cell);
          });
        });

        if (displayTeachers.length === 0) {
          scheduleBody.innerHTML = '<div class="loading">今日無排課</div>';
        }

      } catch (error) {
        console.error('載入課表失敗:', error);
        scheduleBody.innerHTML = '<div class="loading">載入失敗</div>';
      }
    }

    // 取得課程顏色
    function getColorClass(name) {
      if (!name) return 'yellow';
      if (name.includes('動力')) return 'yellow';
      if (name.includes('程式')) return 'orange';
      if (name.includes('科創')) return 'purple';
      if (name.includes('幼兒')) return 'blue';
      return 'green';
    }

    // 切換週
    function changeWeek(delta) {
      currentDate.setDate(currentDate.getDate() + (delta * 7));
      updateCurrentDateDisplay();
      loadSchedule();
    }

    // 跳到今天
    function goToToday() {
      currentDate = new Date();
      currentDayOfWeek = currentDate.getDay();
      updateCurrentDateDisplay();
      loadSchedule();
      updateWeekdayTabs();
    }

    // 跳到指定日期
    function goToDate(dateStr) {
      currentDate = new Date(dateStr);
      currentDayOfWeek = currentDate.getDay();
      updateCurrentDateDisplay();
      loadSchedule();
      updateWeekdayTabs();
    }

    // 設置星期標籤
    function setupWeekdayTabs() {
      const tabs = document.querySelectorAll('.weekday-tab');
      tabs.forEach(tab => {
        tab.addEventListener('click', () => {
          const day = parseInt(tab.dataset.day);
          // 計算目標日期
          const weekStart = getWeekStart(currentDate);
          const targetDate = new Date(weekStart);
          targetDate.setDate(weekStart.getDate() + (day === 0 ? 6 : day - 1));
          currentDate = targetDate;
          currentDayOfWeek = day;
          updateCurrentDateDisplay();
          loadSchedule();
          updateWeekdayTabs();
        });
      });
      updateWeekdayTabs();
    }

    // 更新星期標籤狀態
    function updateWeekdayTabs() {
      const tabs = document.querySelectorAll('.weekday-tab');
      tabs.forEach(tab => {
        const day = parseInt(tab.dataset.day);
        if (day === currentDayOfWeek) {
          tab.classList.add('weekday-tab--active');
        } else {
          tab.classList.remove('weekday-tab--active');
        }
      });
    }

    // 開啟課程詳情 - 跳轉到日誌填寫
    function openScheduleDetail(schedule) {
      // 跳轉到填寫日誌頁面
      window.location.href = `journal.html?schedule_id=${schedule.schedule_id}&date=${formatDateISO(currentDate)}`;
    }
  </script>
  <script src="js/notifications.js"></script>
</body>
</html>
